services:
  api-cli-builder:
    build:
      context: ../../..
      dockerfile: ./docker/builder/api/Dockerfile.api.cli.dev
      args:
        - BUILDKIT_INLINE_CACHE=1
      # No cache_to here: Docker Compose's `cache_to` only supports
      # `type=inline|registry|gha|s3`. `type=inline` causes a BuildKit
      # race condition when multiple services build in parallel
      # (`docker compose up --build` runs all 5 services at once and
      # concurrent writes to the inline cache metadata corrupt the snapshot).
      # The default BuildKit local cache is used instead (file-based,
      # shared across builds, no race). CI pipelines use prod-like compose
      # files where `cache_to: type=inline` is safe (single-service build).
    image: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-cli:latest
    pull_policy: never
    deploy:
      replicas: 0

  # NestJS API for development
  #
  # Postgres is NOT managed by Docker Compose anymore. If SETUP_AUTO=true
  # (opt-in), the app provisions its own Postgres container on demand via
  # PostgresContainerService (dockerode). If SETUP_AUTO=false (default),
  # the app starts without a database and you run the setup wizard manually.
  #
  api-dev:
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-dev
    build:
      context: ../../..
      dockerfile: ./docker/builder/api/Dockerfile.api.dev
      tags:
        - "${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-dev:latest"
        - "${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-dev:${API_VERSION:-dev}"
      args:
        - BUILDKIT_INLINE_CACHE=1
      # No cache_to here: Docker Compose's `cache_to` only supports
      # `type=inline|registry|gha|s3`. `type=inline` causes a BuildKit
      # race condition when multiple services build in parallel
      # (`docker compose up --build` runs all 5 services at once and
      # concurrent writes to the inline cache metadata corrupt the snapshot).
      # The default BuildKit local cache is used instead (file-based,
      # shared across builds, no race). CI pipelines use prod-like compose
      # files where `cache_to: type=inline` is safe (single-service build).
    depends_on: {}
    restart: unless-stopped
    ports:
      - "${API_PORT:-3005}:${API_PORT:-3005}"
      - "${DRIZZLE_STUDIO_PORT:-4983}:4983"
    develop:
      watch:
        # Restart when Docker Compose configuration changes
        - action: restart
          path: ../../..
          target: /app
          include:
            - docker/compose/api/docker-compose.api.dev.yml
            - docker/compose/docker-compose.dev.override.yml
            - docker/compose/docker-compose.dev.yml
        # Sync+Restart when migrations change to automatically apply them
        - action: sync+restart
          initial_sync: true
          path: ../../..
          target: /app
          include:
            - apps/api/src/config/drizzle/migrations/**
        # Rebuild when critical dependency or config files change
        - action: rebuild
          path: ../../..
          target: /app
          include:
            - package.json
            - bun.lock*
            - turbo.json
            - apps/api/package.json
            - apps/api/tsconfig.json
            - apps/api/tsconfig.*.json
            - apps/api/nest-cli.json
            - apps/api/drizzle.config.ts
            - docker/builder/api/Dockerfile.api.dev
            - packages/**/package.json
        # Sync source code excluding node_modules and build artifacts
        - action: sync
          initial_sync: true
          path: ../../..
          target: /app
          ignore:
            # Dependencies
            - node_modules/
            - "**/node_modules/"
            - bun.lock*
            - package-lock.json
            - yarn.lock
            - pnpm-lock.yaml
            # Build outputs
            - "**/dist/"
            - "**/build/"
            - "**/.next/"
            - "**/out/"
            - "**/.output/"
            # Cache directories
            - "**/.turbo/"
            - "**/.cache/"
            - "**/.parcel-cache/"
            - "**/.vite/"
            # Logs
            - "**/*.log"
            - "**/logs/"
            # Git
            - .git/
            - .gitignore
            # Docker
            - docker/
            - Dockerfile*
            - docker-compose*.yml
            - .dockerignore
            # IDE
            - "**/.vscode/"
            - "**/.idea/"
            - "**/*.swp"
            - "**/*.swo"
            # Testing
            - "**/coverage/"
            - "**/.nyc_output/"
            # OS files
            - "**/.DS_Store"
            - "**/Thumbs.db"
    volumes:
      # Persistent caches (shared with web/doc for faster cold starts)
      - bun_cache_dev:/root/.bun/install/cache
      - turbo_cache_dev:/root/.cache/turbo
      # Persistent local SQLite database shared with migrate/seed jobs
      - api_local_db_data_dev:/app/data
      # Persistent uploads directory for media files
      - api_uploads_dev:/app/apps/api/uploads
      # Docker daemon socket for dockerode-backed runtime operations
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Runtime
      - NODE_ENV=development
      # Dev auto-provisioning — triggers Postgres container provisioning
      # via PostgresContainerService (dockerode) in setup-wizard.
      - SETUP_AUTO=${SETUP_AUTO:-false}
      # Database is NOT passed via env — the app provisions Postgres on demand
      # via SETUP_AUTO=true and PostgresContainerService (dockerode).
      # The setup-wizard sub-app auto-triggers local initialization with
      # the full provisioning flow (provision_database → run_migrations →
      # seed_initial_data → register_node → finalize).
      # 
      # Default admin credentials for SETUP_AUTO auto-provisioning
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@admin.com}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-adminadmin}
      
      # API Configuration
      - API_PORT=${API_PORT:-3005}
      - LOG_LEVEL=debug
      - APP_DEBUG_CONTEXT_FILTER=${APP_DEBUG_CONTEXT_FILTER:-}
      - DOCKER_HOST=unix:///var/run/docker.sock
      
      # URLs
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - APP_URL=${APP_URL:-http://web-dev:3000}
      - API_URL=http://api-dev:${API_PORT:-3005}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3005}
      
      # Authentication
      - AUTH_SECRET=${AUTH_SECRET:-fallback-auth-secret}
      - BETTER_AUTH_SECRET=${AUTH_SECRET:-fallback-auth-secret}
      - AUTH_BASE_DOMAIN=${AUTH_BASE_DOMAIN:-http://localhost}
      - DEV_AUTH_KEY=${DEV_AUTH_KEY:-dev-fallback-key}
      # DEFAULT_ADMIN_EMAIL is used for both admin creation and master token impersonation
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      
      # Passkey Configuration
      - PASSKEY_RPID=${PASSKEY_RPID:-localhost}
      - PASSKEY_RPNAME=${PASSKEY_RPNAME:-NestJS App}
      - PASSKEY_ORIGIN=${PASSKEY_ORIGIN:-http://localhost:3000}
      
      # Uploads directory path (absolute path in container)
      - UPLOADS_DIR=${UPLOADS_DIR:-/app/apps/api/uploads}

      # Disable seeding (not needed — SETUP_AUTO handles this)
      - ENABLE_SEEDING=false
      
      # Disable automatic container image scanning (trivy/grype/dive)
      - DISABLE_AUTO_SCAN=true
      
      # Development Tools
      - CHOKIDAR_USEPOLLING=true
      
      # Turbo Remote Cache
      - TURBO_TOKEN=${TURBO_TOKEN}
      - TURBO_TEAM=${TURBO_TEAM}
      # Deterministic mesh IDs for local multi-node testing
      - MESH_CLUSTER_ID=${MESH_CLUSTER_ID:-11111111-1111-4111-8111-111111111111}
      # MESH_NODE_ID has no default. A single-instance dev API will not
      # auto-register a mesh node unless the operator opts in (e.g. by
      # setting MESH_NODE_ID_NODE_1). Mesh-6 compose remains the canonical
      # way to exercise multi-node behaviour. This avoids the dev node
      # being confused with mock data in the dashboard.
      - MESH_NODE_ID=${MESH_NODE_ID_NODE_1:-}
      - MESH_NODE_SERVER_URL=${MESH_NODE_SERVER_URL_NODE_1:-http://api-dev:${API_PORT:-3005}}
      - MESH_STREAM_SHARED_SECRET=${MESH_STREAM_SHARED_SECRET:-dev-mesh-stream-secret}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:${API_PORT:-3005}/health || exit 1
      start_period: 15s
      interval: 15s
      timeout: 15s
      retries: 5
    networks:
      app_network_dev:
        aliases:
          - api-dev
          - api

networks:
  app_network_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_app_network_dev
    driver: bridge

volumes:
  api_local_db_data_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_api_local_db_data_dev
  bun_cache_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_bun_cache_dev
  turbo_cache_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_turbo_cache_dev
  api_uploads_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_api_uploads_dev
