services:
  # NestJS Load Balancer for production-like
  lb-prod:
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-lb-prod
    build:
      context: ../../..
      dockerfile: ./docker/builder/load-balancer/Dockerfile.load-balancer.prod
      args:
        - LOAD_BALANCER_PORT=${LB_PORT:-3010}
    restart: unless-stopped
    ports:
      - "${LB_PORT:-3010}:${LB_PORT:-3010}"
    develop:
      watch:
        # Restart when Docker Compose configuration changes
        - action: restart
          path: ../../..
          target: /app
          include:
            - docker/compose/load-balancer/docker-compose.load-balancer.prod-like.yml
            - docker/compose/docker-compose.prod-like.yml
            - docker/compose/docker-compose.prod-like.override.yml
        # Rebuild when load-balancer source code changes
        - action: rebuild
          path: ../../..
          target: /app
          include:
            - apps/load-balancer/**/*.ts
            - apps/load-balancer/**/*.js
            - apps/load-balancer/**/*.json
            - apps/load-balancer/package.json
            - packages/**/*.ts
            - packages/**/*.js
            - packages/**/package.json
            - package.json
            - turbo.json
          ignore:
            - "**/*.test.ts"
            - "**/*.spec.ts"
            - "**/__tests__/**"
    environment:
      # Runtime
      - NODE_ENV=production
      - LOG_LEVEL=warn

      # Load Balancer
      - LOAD_BALANCER_PORT=${LB_PORT:-3010}

      # Upstream API
      - API_URL=http://api-prod:${API_PORT:-3001}
      - APP_URL=http://web-prod:${WEB_PORT:-3000}

      # Routing / affinity
      - LB_FORWARD_TOKEN_SECRET=${LB_FORWARD_TOKEN_SECRET:-${LB_ROUTE_SECRET:-prod-like-lb-route-secret}}
      - LB_ROUTE_SECRET=${LB_ROUTE_SECRET:-prod-like-lb-route-secret}
      - LB_FORWARD_TOKEN_SECRET_PREVIOUS=${LB_FORWARD_TOKEN_SECRET_PREVIOUS:-${LB_ROUTE_SECRET_PREVIOUS:-}}
      - LB_ROUTE_SECRET_PREVIOUS=${LB_ROUTE_SECRET_PREVIOUS:-}
      - LB_DIAGNOSTIC_SECRET=${LB_DIAGNOSTIC_SECRET:-prod-like-lb-diag-secret}
      - LB_DIAGNOSTIC_PATH_FINGERPRINT=${LB_DIAGNOSTIC_PATH_FINGERPRINT:-__lb_diag}
      - LB_LOCAL_UPSTREAM_URL=${LB_LOCAL_UPSTREAM_URL:-http://api-prod:${API_PORT:-3001}}
      - LB_REPORT_TTL_MS=${LB_REPORT_TTL_MS:-30000}
      - LB_LOAD_REPORT_DEDUPE_TTL_MS=${LB_LOAD_REPORT_DEDUPE_TTL_MS:-120000}
      - LB_LOAD_REPORT_MAX_HOPS=${LB_LOAD_REPORT_MAX_HOPS:-2}
      - LB_PEER_URLS=${LB_PEER_URLS:-}

      # Mesh identity
      - MESH_CLUSTER_ID=${MESH_CLUSTER_ID:-11111111-1111-4111-8111-111111111111}
      - MESH_NODE_ID=${MESH_NODE_ID_LB:-88888888-8888-4888-8888-888888888888}
      - MESH_STREAM_SHARED_SECRET=${MESH_STREAM_SHARED_SECRET:-prod-mesh-stream-secret}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:${LB_PORT:-3010}/health || exit 1
      start_period: 20s
      interval: 15s
      timeout: 15s
      retries: 5
    networks:
      - app_network_prod
