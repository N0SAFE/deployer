services:
  # NestJS Load Balancer for development
  lb-dev:
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-lb-dev
    build:
      context: ../../..
      dockerfile: ./docker/builder/load-balancer/Dockerfile.load-balancer.dev
      tags:
        - "${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-lb-dev:latest"
        - "${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-lb-dev:${LB_VERSION:-dev}"
      args:
        - BUILDKIT_INLINE_CACHE=1
      # No cache_to here: Docker Compose's `cache_to` only supports
      # `type=inline|registry|gha|s3`. `type=inline` causes a BuildKit
      # race condition when multiple services build in parallel
      # (`docker compose up --build` runs all 5 services at once and
      # concurrent writes to the inline cache metadata corrupt the snapshot).
      # The default BuildKit local cache is used instead (file-based,
      # shared across builds, no race). CI pipelines use prod-like compose
      # files where `cache_to: type=inline` is safe (single-service build).
    restart: unless-stopped
    ports:
      - "${LB_PORT:-3010}:${LB_PORT:-3010}"
    develop:
      watch:
        # Restart when Docker Compose configuration changes
        - action: restart
          path: ../../..
          target: /app
          include:
            - docker/compose/load-balancer/docker-compose.load-balancer.dev.yml
            - docker/compose/docker-compose.dev.override.yml
            - docker/compose/docker-compose.dev.yml
        # Rebuild when critical dependency or config files change
        - action: rebuild
          path: ../../..
          target: /app
          include:
            - package.json
            - bun.lock*
            - turbo.json
            - apps/load-balancer/package.json
            - apps/load-balancer/tsconfig.json
            - apps/load-balancer/tsconfig.*.json
            - apps/load-balancer/nest-cli.json
            - docker/builder/load-balancer/Dockerfile.load-balancer.dev
            - packages/**/package.json
        # Sync source code excluding node_modules and build artifacts
        - action: sync
          initial_sync: true
          path: ../../..
          target: /app
          ignore:
            - node_modules/
            - "**/node_modules/"
            - bun.lock*
            - "**/dist/"
            - "**/build/"
            - "**/.next/"
            - "**/.turbo/"
            - "**/.cache/"
            - "**/*.log"
            - "**/logs/"
            - .git/
            - docker/
            - Dockerfile*
            - docker-compose*.yml
            - "**/.vscode/"
            - "**/coverage/"
            - "**/.DS_Store"
    volumes:
      - bun_cache_dev:/root/.bun/install/cache
      - turbo_cache_dev:/root/.cache/turbo
    environment:
      # Runtime
      - NODE_ENV=development
      - LOG_LEVEL=debug

      # Load Balancer
      - LOAD_BALANCER_PORT=${LB_PORT:-3010}

      # Upstream API (primary node in standard 2-node dev setup)
      - API_URL=http://api-dev:${API_PORT:-3005}
      - APP_URL=http://web-dev:${WEB_PORT:-3000}

      # Routing / affinity
      - LB_FORWARD_TOKEN_SECRET=${LB_FORWARD_TOKEN_SECRET:-${LB_ROUTE_SECRET:-dev-lb-route-secret}}
      - LB_ROUTE_SECRET=${LB_ROUTE_SECRET:-dev-lb-route-secret}
      - LB_FORWARD_TOKEN_SECRET_PREVIOUS=${LB_FORWARD_TOKEN_SECRET_PREVIOUS:-${LB_ROUTE_SECRET_PREVIOUS:-}}
      - LB_ROUTE_SECRET_PREVIOUS=${LB_ROUTE_SECRET_PREVIOUS:-}
      - LB_DIAGNOSTIC_SECRET=${LB_DIAGNOSTIC_SECRET:-dev-lb-diag-secret}
      - LB_DIAGNOSTIC_PATH_FINGERPRINT=${LB_DIAGNOSelTIC_PATH_FINGERPRINT:-__lb_diag}
      - LB_LOCAL_UPSTREAM_URL=${LB_LOCAL_UPSTREAM_URL:-http://api-dev:${API_PORT:-3005}}
      - LB_REPORT_TTL_MS=${LB_REPORT_TTL_MS:-30000}
      - LB_LOAD_REPORT_DEDUPE_TTL_MS=${LB_LOAD_REPORT_DEDUPE_TTL_MS:-120000}
      - LB_LOAD_REPORT_MAX_HOPS=${LB_LOAD_REPORT_MAX_HOPS:-2}
      # Comma-separated peer LB URLs; empty = single-LB mode (standard dev setup)
      - LB_PEER_URLS=${LB_PEER_URLS:-}

      # Mesh identity
      - MESH_CLUSTER_ID=${MESH_CLUSTER_ID:-11111111-1111-4111-8111-111111111111}
      - MESH_NODE_ID=${MESH_NODE_ID_LB:-88888888-8888-4888-8888-888888888888}
      - MESH_STREAM_SHARED_SECRET=${MESH_STREAM_SHARED_SECRET:-dev-mesh-stream-secret}

      # Turbo Remote Cache
      - TURBO_TOKEN=${TURBO_TOKEN}
      - TURBO_TEAM=${TURBO_TEAM}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:${LB_PORT:-3010}/health || exit 1
      start_period: 15s
      interval: 15s
      timeout: 15s
      retries: 5
    networks:
      app_network_dev:
        aliases:
          - lb-dev
          - load-balancer
