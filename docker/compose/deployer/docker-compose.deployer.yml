# Single-container deployer — runs both API + Web in one container.
#
# This is the production deployment target. Upgrading is just:
#   docker compose pull
#   docker compose up -d
#
# Secrets (AUTH_SECRET, BETTER_AUTH_SECRET, MESH_NODE_ID, DEFAULT_ADMIN_*)
# are resolved through mesh secret sharing at runtime — not from env vars.
# The database URL is resolved through the Phase 0 setup sub-app and persisted
#
# The unified entrypoint handles:
#   - NestJS API (with startup orchestrator for migrations, mesh, admin)
#   - Next.js web server (built at runtime so prerender uses the live API)

services:
  deployer:
    container_name: ${COMPOSE_PROJECT_NAME:-tgclub}-deployer
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-sebille}/deployer:latest
    build:
      context: ../../..
      dockerfile: docker/builder/deployer/Dockerfile.prod
      args: []
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
      - "${NEXT_PUBLIC_APP_PORT:-3000}:${NEXT_PUBLIC_APP_PORT:-3000}"
    networks:
      - deployer_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Runtime
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-warn}

      # Database — resolved at runtime via setup sub-app (Phase 0) or node_config.
      # SETUP_AUTO_DATABASE_URL (legacy alias: SETUP_DATABASE_URL) is NOT read
      # at runtime — it's only used by Phase 0 to persist to SQLite. The
      # InitializationService reads from SQLite node_config. The global DB is
      # mandatory — with SETUP_AUTO=true an unreachable URL fails boot hard.
      - NODE_LOCAL_DB_PATH=${NODE_LOCAL_DB_PATH:-/data/local.db}

      # API Configuration
      - API_PORT=${API_PORT:-3001}
      - MESH_NODE_SERVER_URL=${MESH_NODE_SERVER_URL:-http://localhost:3001}

      # Web Configuration
      - NEXT_PUBLIC_APP_PORT=${NEXT_PUBLIC_APP_PORT:-3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}

      # Authentication — resolved through mesh secret sharing at runtime.
      # Not set via environment variables. The mesh provides these during
      # node enrollment.

    volumes:
      # Persist local SQLite database
      - deployer_data:/data
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Cloudflare Tunnel connector for the deployer platform's own tunnel
  # ("global" tunnel). Runs cloudflared with the platform tunnel's run token,
  # routing the public hostname (e.g. deployer.sebille.net) to the platform
  # TRAEFIK (web:80) — the single entry point for ALL public traffic. Traefik
  # then routes by Host: the node's global address → the API, deployments →
  # their containers, the web app's own address → the web app.
  #
  # Set the tunnel id + run token in the environment:
  #   CLOUDFLARE_TUNNEL_ID="f4330659-dc10-4e24-8337-e459fb313b47"   # optional
  #   CLOUDFLARE_TUNNEL_TOKEN="<token>"       # from `bun --bun run api -- tunnel:bootstrap`
  #
  # The ingress below is written at container start from env and used instead
  # of the tunnel's remote config (which may be empty until the API provisions
  # it) — so the hostname enters Traefik immediately, even on first boot.
  cloudflared:
    container_name: ${COMPOSE_PROJECT_NAME:-tgclub}-cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:-f4330659-dc10-4e24-8337-e459fb313b47}
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in your environment}
      CLOUDFLARE_TUNNEL_HOSTNAME: ${CLOUDFLARE_TUNNEL_HOSTNAME:-deployer.sebille.net}
      # Global tunnel ingress → the platform TRAEFIK (web:80). Traefik routes
      # the global hostname to the API (dynamic-domain.yml); the web app has
      # its own surface via the managed-web section.
      CLOUDFLARE_TUNNEL_SERVICE: ${CLOUDFLARE_TUNNEL_SERVICE_URL:-http://deployer-traefik:80}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cat > /etc/cloudflared/config.yml <<EOF
        tunnel: $$CLOUDFLARE_TUNNEL_ID
        token: $$CLOUDFLARE_TUNNEL_TOKEN
        ingress:
          - hostname: $$CLOUDFLARE_TUNNEL_HOSTNAME
            service: $$CLOUDFLARE_TUNNEL_SERVICE
          - service: http_status:404
        EOF
        exec cloudflared tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    depends_on:
      - deployer
    networks:
      - deployer_network
      # Join the PLATFORM network (the same one the API-supervised Traefik
      # joins) so the cloudflared connector can resolve `deployer-traefik` —
      # the tunnel's ingress target (web:80). Compose creates it if absent;
      # the Traefik supervisor REUSES it by name (ensureNetwork inspects
      # first).
      - deployer-platform

networks:
  deployer_network:
    driver: bridge
  deployer-platform:
    name: deployer-platform
    driver: bridge

volumes:
  deployer_data:
