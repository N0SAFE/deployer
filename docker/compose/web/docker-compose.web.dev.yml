services:
  # Next.js web app for development with HMR
  web-dev:
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-web-dev
    build:
      context: ../../..
      dockerfile: ./docker/builder/web/Dockerfile.web.dev
      tags:
        - "${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-web-dev:latest"
        - "${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-web-dev:${WEB_VERSION:-dev}"
      args:
        - NODE_ENV=development
        - API_PORT=${API_PORT:-3005}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3005}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        - NEXT_PUBLIC_APP_PORT=${NEXT_PUBLIC_APP_PORT:-3000}
        - NEXT_PUBLIC_APP_DEBUG_CONTEXT_FILTER=${APP_DEBUG_CONTEXT_FILTER}
        - BUILDKIT_INLINE_CACHE=1
      # No cache_to here: Docker Compose's `cache_to` only supports
      # `type=inline|registry|gha|s3`. `type=inline` causes a BuildKit
      # race condition when multiple services build in parallel
      # (`docker compose up --build` runs all 5 services at once and
      # concurrent writes to the inline cache metadata corrupt the snapshot).
      # The default BuildKit local cache is used instead (file-based,
      # shared across builds, no race). CI pipelines use prod-like compose
      # files where `cache_to: type=inline` is safe (single-service build).
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "${NEXT_PUBLIC_APP_PORT:-3000}:${NEXT_PUBLIC_APP_PORT:-3000}"
    develop:
      watch:
        # Restart when Docker Compose configuration changes
        - action: restart
          path: ../../..
          target: /app
          include:
            - docker/compose/web/docker-compose.web.dev.yml
            - docker/compose/docker-compose.dev.override.yml
            - docker/compose/docker-compose.dev.yml
        # Rebuild when critical dependency or config files change
        - action: rebuild
          path: ../../..
          target: /app
          include:
            - package.json
            - bun.lock*
            - turbo.json
            - apps/web/package.json
            - apps/web/tsconfig.json
            - apps/web/tsconfig.*.json
            - apps/web/next.config.ts
            - apps/web/next.config.js
            - apps/web/next.config.mjs
            - apps/web/tailwind.config.*
            - apps/web/postcss.config.*
            - apps/web/declarative-routing.config.json
            - docker/builder/web/Dockerfile.web.dev
            - packages/**/package.json
        # Sync source code excluding node_modules and build artifacts
        - action: sync
          initial_sync: true
          path: ../../..
          target: /app
          ignore:
            # Dependencies
            - node_modules/
            - "**/node_modules/"
            - bun.lock*
            - package-lock.json
            - yarn.lock
            - pnpm-lock.yaml
            # Build outputs
            - "**/dist/"
            - "**/build/"
            - "**/.next/"
            - "**/out/"
            - "**/.output/"
            # Cache directories
            - "**/.turbo/"
            - "**/.cache/"
            - "**/.parcel-cache/"
            - "**/.vite/"
            # Generated files (declarative-routing)
            - "apps/web/src/routes/index.ts"
            - "apps/web/src/routes/openapi.ts"
            # Logs
            - "**/*.log"
            - "**/logs/"
            # Git
            - .git/
            - .gitignore
            # Docker
            - docker/
            - Dockerfile*
            - docker-compose*.yml
            - .dockerignore
            # IDE
            - "**/.vscode/"
            - "**/.idea/"
            - "**/*.swp"
            - "**/*.swo"
            # Testing
            - "**/coverage/"
            - "**/.nyc_output/"
            # OS files
            - "**/.DS_Store"
            - "**/Thumbs.db"
    volumes:
      # Persistent build caches (named volumes) to speed up installs/builds
      - bun_cache_dev:/root/.bun/install/cache
      - turbo_cache_dev:/root/.cache/turbo
    environment:
      # Runtime
      - NODE_ENV=development
      - NODE_OPTIONS=--dns-result-order=ipv4first
      
      # URLs - Server-side (internal Docker network)
      - API_URL=http://${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-dev:${API_PORT:-3005}
      - APP_URL=${APP_URL:-http://web-dev:3000}
      
      # URLs - Client-side (browser access via localhost)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3005}
      - NEXT_PUBLIC_API_PORT=${API_PORT:-3005}
      - NEXT_PUBLIC_MESH_PEER_NODE_ID=${NEXT_PUBLIC_MESH_PEER_NODE_ID:-33333333-3333-4333-8333-333333333333}
      - NEXT_PUBLIC_MESH_PEER_ENDPOINT=${NEXT_PUBLIC_MESH_PEER_ENDPOINT:-ws://api-dev-2:${API_PORT_NODE_2:-3006}/mesh}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_PORT=${NEXT_PUBLIC_APP_PORT:-3000}
      - NEXT_PUBLIC_DOC_URL=${NEXT_PUBLIC_DOC_URL:-http://localhost:${NEXT_PUBLIC_DOC_PORT:-3020}}
      - NEXT_PUBLIC_DOC_PORT=${NEXT_PUBLIC_DOC_PORT:-3020}
      
      # Authentication
      - AUTH_SECRET=${AUTH_SECRET:-fallback-auth-secret}
      - BETTER_AUTH_SECRET=${AUTH_SECRET:-fallback-auth-secret}
      - AUTH_BASE_DOMAIN=${AUTH_BASE_DOMAIN:-http://localhost}
      - DEV_AUTH_KEY=${DEV_AUTH_KEY:-dev-fallback-key}
      - NEXT_PUBLIC_DEV_AUTH_KEY=${NEXT_PUBLIC_DEV_AUTH_KEY:-${DEV_AUTH_KEY:-dev-fallback-key}}
      
      # Debug Configuration
      - NEXT_PUBLIC_DEBUG=${NEXT_PUBLIC_DEBUG}
      - NEXT_PUBLIC_APP_DEBUG_CONTEXT_FILTER=${APP_DEBUG_CONTEXT_FILTER}
      
      # Development Tools - Hot Reloading
      # Keep polling disabled by default (compose sync + native fs events);
      # can be re-enabled via env override if a host filesystem requires it.
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-false}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-false}
      - NEXT_WEBPACK_USEPOLLING=${NEXT_WEBPACK_USEPOLLING:-0}
      
      # Turbo Remote Cache
      - TURBO_TOKEN=${TURBO_TOKEN}
      - TURBO_TEAM=${TURBO_TEAM}
    networks:
      - app_network_dev

networks:
  app_network_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_app_network_dev
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

volumes:
  bun_cache_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_bun_cache_dev
  turbo_cache_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_turbo_cache_dev
