# =====================================================================
# DEV-SUPERVISED profile — the PROD flow, running locally-built dev images.
#
# ── WHAT COMPOSE DOES HERE, AND WHAT IT DELIBERATELY DOES NOT ────────────────
# TWO responsibilities, and nothing else:
#
#   1. BUILD THE IMAGES. `build-api`, `build-web` and `build-doc` are IMAGE
#      PRODUCERS: they build, print the tag they produced, and EXIT. They are
#      not application services, and `restart: "no"` is what keeps them from
#      looping.
#   2. RUN SETUP. `setup-dev` is the ONLY long-running service in this profile.
#      It is the entry point, because the platform cannot be started by compose:
#      setup founds the swarm, schedules the API onto it from the tag it was
#      given, streams both steps to the wizard, and hands over.
#
# Compose therefore manages NO platform services — no global-db, no redis, no
# traefik, no drizzle-gateway, no api container, no web container. The API
# SUPERVISES all of those itself once it is scheduled, which is exactly what
# distinguishes this profile from plain `dev`.
#
# ── WHY `context: ../..` AND NOT `../../..` ─────────────────────────────────
# Compose resolves `build.context` relative to the DIRECTORY OF THIS FILE, and
# this file lives at `docker/compose/` — one level SHALLOWER than the
# `common/*/docker-compose.config.*.yml` files, which need `../../../..`.
#
# `../../..` from here is `tests/deployer/`, i.e. one level ABOVE the repository.
# The build then failed before reading a single Dockerfile:
#
#   resolve : lstat /home/sebille/.../deployer/docker: no such file or directory
#
# so no image was produced and the profile could not start at all.
# =====================================================================

name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-supervised

services:
  setup-dev:
    extends:
      file: ./common/setup/docker-compose.config.dev.yml
      service: setup
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-setup-dev
    # ── NO dep-output MOUNT, AND THE PACKAGES ARE BAKED ───────────────────────
    # This profile is swarm-managed, so the shared dev config's assumptions do
    # not hold: there is no `dependency-builder` service to produce the volume,
    # and setup runs as a SCHEDULED SWARM SERVICE — which cannot be handed a
    # compose volume of prebuilt packages.
    #
    # `!override` REPLACES the inherited list rather than appending to it. The
    # list below is the full set this service needs, so the inherited
    # `dep_output_dev` entry disappears — without which compose rejects the whole
    # project with `refers undefined volume dep_output_dev`, since this profile
    # declares no such volume.
    build:
      args:
        # Baking is what makes the image self-contained for the cluster.
        - APP_DEPS_MODE=baked
    depends_on:
      # Only the IMAGE is a prerequisite. Setup itself founds the swarm, so it
      # cannot wait for anything cluster-related — that IS the work. Same as prod.
      build-api:
        condition: service_completed_successfully
    environment:
      # ── THIS PROFILE IS PROD'S FLOW, RUNNING DEV IMAGES ───────────────────
      # `SETUP_MODE=prod` — NOT `dev`. Compose manages NO services here, so
      # nothing else can start the API: setup founds the cluster, schedules the
      # API onto it as a swarm service, streams both steps to the wizard, then
      # hands over. That is byte-for-byte the prod flow, with the API's image
      # prebuilt locally instead of pulled from a registry.
      #
      # WHY THIS WAS `dev` BEFORE, AND WHY THAT WAS WRONG
      # It described the ADDRESS SOURCE ("the API answers at a name compose fills
      # in") rather than the OWNERSHIP ("who starts the API"). Those were the same
      # question only while compose owned the API — which is exactly what this
      # profile exists to stop doing. The result was that setup waited for a
      # compose-managed API that this profile never starts, so the flow stalled.
      #
      # `SETUP_API_URL` stays: it is still the address the API answers at, and
      # in prod mode setup reads it AFTER scheduling the service.
      SETUP_MODE: "prod"
      SETUP_API_URL: http://api-dev:${API_PORT:-3005}
      SETUP_API_PORT: ${API_PORT:-3005}
      # The tags setup SCHEDULES onto the cluster. Produced by `build-api` above;
      # in a real deployment this points at a registry and nothing else changes.
      DEPLOYER_API_IMAGE: ${DEPLOYER_API_IMAGE:-deployer-api:dev}
      # The tags setup FORWARDS to the API it schedules, so the platform converges
      # the images compose actually built. These names are the ones the API reads
      # (`MANAGED_WEB_APP_IMAGE` for the dashboard, `DEPLOYER_*_IMAGE` for the
      # supervised services) — the API's own fallbacks are `:latest`, which no dev
      # producer tags, so without these the dashboard would never converge.
      MANAGED_WEB_APP_IMAGE: ${MANAGED_WEB_APP_IMAGE:-deployer-web:dev}
      DEPLOYER_TRAEFIK_IMAGE: ${DEPLOYER_TRAEFIK_IMAGE:-traefik:v3.6.10}
      DEPLOYER_REDIS_IMAGE: ${DEPLOYER_REDIS_IMAGE:-redis:7-alpine}
      DEPLOYER_DIRECT_PROXY_IMAGE: ${DEPLOYER_DIRECT_PROXY_IMAGE:-}
      # The managed web app is a SWARM SERVICE here, so the API converges it
      # rather than treating it as an externally-run container.
      MANAGED_WEB_APP_ENABLED: "true"
      MANAGED_WEB_APP_EXTERNAL: "false"
      # NOTHING RUNS TRAEFIK IN THIS PROFILE — compose manages no services here,
      # and the API that would supervise the ingress cannot start until setup's
      # gate opens. So SETUP runs the bootstrap ingress: without it this app is
      # unreachable (it publishes no ports), the wizard can never be completed,
      # and the gate never opens. See `BootstrapIngressService`.
      MANAGED_TRAEFIK_ENABLED: "false"
      DEPLOYER_PREFIX: ${DEPLOYER_PREFIX:-}
      # ── THE SHARED NODE-STATE VOLUME, NAMED EXACTLY AS COMPOSE CREATED IT ──
      # Setup SCHEDULES the API and mounts this volume into that task, so it has
      # to name the SAME volume this container writes. Compose prefixes volumes
      # with the project name, which setup cannot guess, so the resolved name is
      # passed in rather than reconstructed — the same arrangement
      # `TRAEFIK_CONFIG_VOLUME` already uses for the ingress config.
      NODE_LOCAL_DB_VOLUME: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_api_local_db_data_dev
      MANAGED_WIREGUARD_IP: ${MANAGED_WIREGUARD_IP:-}
      APP_URL: ${APP_URL:-http://web-dev:3000}
    # NO `ports:` — internal only, reached through Traefik.
    volumes: !override
      - api_local_db_data_dev:/app/data
      # ── THE INGRESS CONFIG VOLUME — REQUIRED, AND `!override` HIDES THAT ───
      # Setup runs the BOOTSTRAP INGRESS itself on this profile (compose manages
      # no services), and it writes the routing rules Traefik reads:
      #
      #   setup writes  /app/traefik-configs/dynamic-setup.yml
      #   traefik reads deployer-traefik-config mounted at /config
      #
      # Those are the SAME named volume, so this mount is what connects them.
      # Omitting it is not a silent degradation — setup writes the file into its
      # own container filesystem, Traefik's `/config` stays EMPTY, and the
      # ingress answers `404 page not found` for every hostname. The wizard is
      # then unreachable (this app publishes no ports) and onboarding cannot
      # start at all.
      #
      # `!override` REPLACES the inherited list, so the entry the shared dev
      # config already declared here disappears unless it is restated. That is
      # exactly how it went missing: the override was added for `dep-output` and
      # silently took this one with it.
      - deployer-traefik-config:/app/traefik-configs
      # The clusters it creates live on the host engine, so it drives the socket.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      app_network_dev:
        aliases:
          - setup-dev
          - setup
      deployer_platform:
        aliases:
          - setup-dev
          - setup
      # NOTE: the swarm OVERLAY is deliberately NOT listed here. It is created by
      # setup at RUNTIME (the same idempotent `ensureOverlayNetwork` the API's
      # supervisors call), so listing it would make compose require a network
      # that does not exist until the container it is starting has already run.
      # Setup attaches ITSELF to it once created — see `connectToPlatformOverlay`.

  # ── Build-only: produces the API image, then exits ─────────────────────────
  #
  # ── WHY THE API IS NOT A COMPOSE SERVICE IN THIS PROFILE ────────────────────
  # This profile is PROD'S FLOW in dev: setup founds the cluster and schedules the
  # API onto it as a swarm service. A compose-managed `api-dev` container would
  # not be part of that cluster, so it would have no placement, no restart policy
  # across nodes and no `service ls` visibility — i.e. it would silently NOT be
  # the thing this profile exists to exercise.
  #
  # So compose does exactly one thing here: PRODUCE THE IMAGE. Setup consumes the
  # TAG (`DEPLOYER_API_IMAGE`), never the build — the same arrangement as prod,
  # where the tag points at a registry instead and nothing else changes.
  #
  # A separate service rather than a build step on `setup`, because a health-gated
  # startup must not CONTAIN a multi-minute build: it would make the healthcheck's
  # `start_period` meaningless and put two responsibilities in one container.
  build-api:
    build:
      context: ../..
      dockerfile: ./docker/builder/app/Dockerfile.app.dev
      args:
        # baked, not volume: this image is scheduled as a SWARM SERVICE by setup,
        # and a swarm service cannot be handed a compose volume of prebuilt
        # packages. Building them in makes the image self-contained.
        - APP=api
        - APP_DEPS_MODE=baked
        - BUILDKIT_INLINE_CACHE=1
    image: ${DEPLOYER_API_IMAGE:-deployer-api:dev}
    # Runs once, ensures the tag exists, exits. `restart: "no"` is required — the
    # default restart policy would loop it forever.
    command: ["echo", "api image built: ${DEPLOYER_API_IMAGE:-deployer-api:dev}"]
    restart: "no"

  # ── IMAGE PRODUCERS, not runtime services ─────────────────────────────────
  #
  # SETUP is the only long-running service in this profile. Web and doc exist
  # here for exactly one reason — to make their IMAGES exist, so the platform has
  # something to schedule. They carry no runtime command: each starts, prints the
  # tag it produced, and exits.
  #
  # `restart: "no"` is required, not cosmetic: the default restart policy would
  # loop them forever.
  build-web:
    build:
      context: ../..
      dockerfile: ./docker/builder/app/Dockerfile.app.dev
      args:
        - APP=web
        - APP_DEPS_MODE=baked
        - BUILDKIT_INLINE_CACHE=1
    # The SAME variable setup forwards to the API, so "the image compose built"
    # and "the image the platform converges" cannot drift into two tags.
    image: ${MANAGED_WEB_APP_IMAGE:-deployer-web:dev}
    command: ["echo", "web image built: ${MANAGED_WEB_APP_IMAGE:-deployer-web:dev}"]
    restart: "no"

  build-doc:
    build:
      context: ../..
      dockerfile: ./docker/builder/app/Dockerfile.app.dev
      args:
        - APP=doc
        - APP_DEPS_MODE=baked
        - BUILDKIT_INLINE_CACHE=1
    image: ${DEPLOYER_DOC_IMAGE:-deployer-doc:dev}
    command: ["echo", "doc image built: ${DEPLOYER_DOC_IMAGE:-deployer-doc:dev}"]
    restart: "no"
networks:
  deployer_platform:
    name: deployer-platform
    driver: bridge
  app_network_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_app_network_dev
    driver: bridge

volumes:
  api_local_db_data_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_api_local_db_data_dev
  deployer-traefik-config:
    name: ${TRAEFIK_CONFIG_VOLUME:-deployer-traefik-config}
  deployer-port-proxy-config:
    name: ${DIRECT_PROXY_CONFIG_VOLUME:-deployer-port-proxy-config}