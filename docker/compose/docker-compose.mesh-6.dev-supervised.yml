# =====================================================================
# MESH-6 DEV-SUPERVISED — 6-node mesh, API owns the platform services
# (no compose-managed global-db / redis / traefik — like prod but built
# from the DEV api image in watch/dev mode). Nodes EXTEND the api DEV
# base one per node; WireGuard sidecars EXTEND the wireguard base.
# =====================================================================

name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-mesh-6-dev-supervised

services:
  api-1:
    extends:
      file: ./common/api/docker-compose.config.dev.yml
      service: api
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-mesh-dev-1
    environment:
      API_PORT: "3301"
      SETUP_AUTO: "true"
      MANAGED_GLOBAL_DB_ENABLED: "false"
      MANAGED_REDIS_ENABLED: "false"
      MANAGED_LOCAL_DB_ENABLED: "false"
      MANAGED_TRAEFIK_ENABLED: "false"
      API_URL: http://api-mesh-dev-1:3301
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3301}
      ENABLE_SEEDING: "false"
      NODE_LOCAL_DB_PATH: /app/data/local-mesh-node-1.db
      MESH_NODE_ID: ${MESH_NODE_ID_NODE_1:-22222222-2222-4222-8222-222222222222}
      MESH_NODE_SERVER_URL: ${MESH_NODE_SERVER_URL_NODE_1:-http://api-mesh-dev-1:3301}
      MESH_BOOTSTRAP_PEERS: ${MESH_BOOTSTRAP_PEERS_NODE_1:-33333333-3333-4333-8333-333333333333@ws://api-mesh-dev-2:3302/mesh,44444444-4444-4444-8444-444444444444@ws://api-mesh-dev-3:3303/mesh,55555555-5555-4555-8555-555555555555@ws://api-mesh-dev-4:3304/mesh,66666666-6666-4666-8666-666666666666@ws://api-mesh-dev-5:3305/mesh,77777777-7777-4777-8777-777777777777@ws://api-mesh-dev-6:3306/mesh}
    networks:
      app_network_dev:
        aliases:
          - api-mesh-dev-1
          - mesh-node-1
      deployer_platform: {}

  api-2:
