services:
  api-db-mesh-prod:
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-db-mesh-prod
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-nestjs_api}
    volumes:
      - api_db_data_mesh_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_DATABASE:-nestjs_api}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mesh_network_prod

  api-mesh-prod-1:
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-mesh-prod-1
    build:
      context: ../..
      dockerfile: ./docker/builder/api/Dockerfile.api.prod
      args:
        - API_PORT=3401
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3401}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3100}
    depends_on:
      api-db-mesh-prod:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${MESH_PROD_API_PORT_1:-3401}:3401"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=warn
      - APP_DEBUG_CONTEXT_FILTER=${APP_DEBUG_CONTEXT_FILTER:-}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@api-db-mesh-prod:5432/${DB_DATABASE:-nestjs_api}
      - MIGRATIONS_FOLDER=./dist/migrations
      - API_PORT=3401
      - API_URL=http://api-mesh-prod-1:3401
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3401}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3100}
      - APP_URL=http://web-mesh-prod:3100
      - AUTH_SECRET=${AUTH_SECRET:-fallback-auth-secret}
      - BETTER_AUTH_SECRET=${AUTH_SECRET:-fallback-auth-secret}
      - AUTH_BASE_DOMAIN=${AUTH_BASE_DOMAIN:-http://localhost}
      - DEV_AUTH_KEY=${DEV_AUTH_KEY:-dev-auth-key}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      - UPLOADS_DIR=/app/apps/api/uploads
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@admin.com}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-adminadmin}
      - ENABLE_SEEDING=true
      - MESH_CLUSTER_ID=${MESH_CLUSTER_ID:-11111111-1111-4111-8111-111111111111}
      - MESH_NODE_ID=${MESH_NODE_ID_NODE_1:-22222222-2222-4222-8222-222222222222}
      - MESH_STREAM_SHARED_SECRET=${MESH_STREAM_SHARED_SECRET:-prod-mesh-stream-secret}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3401/health || exit 1
      start_period: 20s
      interval: 15s
      timeout: 15s
      retries: 5
    networks:
      - mesh_network_prod
    volumes:
      - bun_cache_mesh_prod:/root/.bun/install/cache
      - turbo_cache_mesh_prod:/root/.cache/turbo
      - api_uploads_mesh_prod_1:/app/apps/api/uploads

