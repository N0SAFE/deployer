# =====================================================================
# Redis BASE config — INCLUDE-ONLY (real base: image, AOF, healthcheck,
# data volume). Extended by the dev orchestrator (compose-managed,
# MANAGED_REDIS_ENABLED=true); networks are wired there.
# =====================================================================
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis_data_dev:/data