# =====================================================================
# Web PROD variant — INCLUDE-ONLY (real base: prod build).
# =====================================================================
services:
  web:
    restart: unless-stopped
    build:
      context: ../../../../
      dockerfile: ./docker/builder/web/Dockerfile.web.runtime.prod
      args:
        - NODE_ENV=production
        - API_PORT=${API_PORT:-3001}
        - API_URL=http://api-prod:${API_PORT:-3001}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api.deployer.localhost}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://web.deployer.localhost}
        - NEXT_PUBLIC_APP_PORT=${NEXT_PUBLIC_APP_PORT:-3000}
        - NEXT_PUBLIC_APP_DEBUG_CONTEXT_FILTER=${APP_DEBUG_CONTEXT_FILTER:-}
        - BUILDKIT_INLINE_CACHE=1
      cache_to:
        - type=inline
    ports:
      - "${NEXT_PUBLIC_APP_PORT:-3000}:${NEXT_PUBLIC_APP_PORT:-3000}"
    environment:
      NODE_ENV: production
      # URLs — server-side (internal Docker network)
      API_URL: http://${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-prod:${API_PORT:-3001}
      APP_URL: ${APP_URL:-http://${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-web-prod:${NEXT_PUBLIC_APP_PORT:-3000}}
      # URLs — client-side (external access — must be public URL in production)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.deployer.localhost}
      NEXT_PUBLIC_API_PORT: ${API_PORT:-3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://web.deployer.localhost}
      NEXT_PUBLIC_APP_PORT: ${NEXT_PUBLIC_APP_PORT:-3000}
      NEXT_PUBLIC_APP_DEBUG_CONTEXT_FILTER: ${APP_DEBUG_CONTEXT_FILTER:-}
      # Authentication
      AUTH_SECRET: ${AUTH_SECRET:-fallback-auth-secret}
      BETTER_AUTH_SECRET: ${AUTH_SECRET:-fallback-auth-secret}
      AUTH_BASE_DOMAIN: ${AUTH_BASE_DOMAIN:-.deployer.localhost}
      DEV_AUTH_KEY: ${DEV_AUTH_KEY:-dev-fallback-key}
    volumes:
      # Cache directories to speed rebuilds (only useful if containers are
      # recreated frequently on the same host)
      - bun_cache_prod:/root/.bun/install/cache
      - turbo_cache_prod:/root/.cache/turbo