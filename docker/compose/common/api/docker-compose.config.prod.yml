# =====================================================================
# Api PROD variant — INCLUDE-ONLY. Extends the api base; the prod
# orchestrator extends THIS (API owns everything, prod logging + build).
# =====================================================================
services:
  api:
    extends:
      file: ./docker-compose.config.yml
      service: api
    build:
      context: ../../../..
      dockerfile: ./docker/builder/api/Dockerfile.api.prod
      args:
        - API_PORT=${API_PORT:-3001}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api.deployer.localhost}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://web.deployer.localhost}
        - AUTH_SECRET=${AUTH_SECRET:-}
    volumes:
      # Persistent local SQLite database (prod volume).
      - api_local_db_data_prod:/app/data
      # Persistent uploads directory for media files.
      - api_uploads_prod:/app/apps/api/uploads
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
      API_PORT: ${API_PORT:-3001}
      APP_URL: ${APP_URL:-http://web-prod:3000}
      API_URL: http://api-prod:${API_PORT:-3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.deployer.localhost}
      MIGRATIONS_FOLDER: ./dist/migrations