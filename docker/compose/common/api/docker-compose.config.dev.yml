# =====================================================================
# Api DEV variant — INCLUDE-ONLY. Extends the api base; carries the dev
# build, the full `develop.watch` block, dev env, and the healthcheck.
# The dev orchestrator extends THIS and adds only per-project wiring.
# =====================================================================
services:
  api:
    extends:
      file: ./docker-compose.config.yml
      service: api
    build:
      context: ../../../../
      dockerfile: ./docker/builder/api/Dockerfile.api.dev
      tags:
        - "${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-dev:latest"
      args:
        - BUILDKIT_INLINE_CACHE=1
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      API_PORT: ${API_PORT:-3005}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://web-dev:3000}
      API_URL: http://api-dev:${API_PORT:-3005}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.deployer.localhost}
      APP_DEBUG_CONTEXT_FILTER: ${APP_DEBUG_CONTEXT_FILTER:-}
      MANAGED_WEB_APP_EXTERNAL: ${MANAGED_WEB_APP_EXTERNAL:-true}
      MANAGED_WEB_APP_ENABLED: ${MANAGED_WEB_APP_ENABLED:-false}
      DEPLOYER_WEB_TARGET: ${DEPLOYER_WEB_TARGET:-web-dev}
      DEPLOYER_API_TARGET: ${DEPLOYER_API_TARGET:-api-dev}
      DIRECT_PROXY_WEB_TARGET: ${DIRECT_PROXY_WEB_TARGET:-web-dev}
      DISABLE_AUTO_SCAN: "true"
      CHOKIDAR_USEPOLLING: "true"
      MESH_CLUSTER_ID: ${MESH_CLUSTER_ID:-11111111-1111-4111-8111-111111111111}
      MESH_NODE_ID: ${MESH_NODE_ID_NODE_1:-}
      MESH_NODE_SERVER_URL: ${MESH_NODE_SERVER_URL_NODE_1:-http://api-dev:${API_PORT:-3005}}
      MESH_STREAM_SHARED_SECRET: ${MESH_STREAM_SHARED_SECRET:-dev-mesh-stream-secret}
    volumes:
      # Persistent local SQLite database shared with migrate/seed jobs.
      - api_local_db_data_dev:/app/data
      # Persistent uploads directory for media files.
      - api_uploads_dev:/app/apps/api/uploads
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:${API_PORT:-3005}/health || exit 1
      start_period: 15s
      interval: 15s
      timeout: 15s
      retries: 5
    develop:
      watch:
        # Restart when Docker Compose configuration changes
        - action: restart
          path: ../../../../
          target: /app
          include:
            - docker/compose/api/docker-compose.api.dev.yml
            - docker/compose/docker-compose.dev.yml
        # Sync+Restart when migrations change to automatically apply them
        - action: sync+restart
          initial_sync: true
          path: ../../../../
          target: /app
          include:
            - apps/api/src/config/drizzle/migrations/**
        # Rebuild when critical dependency or config files change
        - action: rebuild
          path: ../../../../
          target: /app
          include:
            - package.json
            - bun.lock*
            - turbo.json
            - apps/api/package.json
            - apps/api/tsconfig.json
            - apps/api/tsconfig.*.json
            - apps/api/nest-cli.json
            - apps/api/drizzle.config.ts
            - docker/builder/api/Dockerfile.api.dev
            - packages/**/package.json
        # Sync source code excluding node_modules and build artifacts
        - action: sync
          initial_sync: true
          path: ../../../../
          target: /app
          ignore:
            - node_modules/
            - "**/node_modules/"
            - bun.lock*
            - package-lock.json
            - yarn.lock
            - pnpm-lock.yaml
            - "**/dist/"
            - "**/build/"
            - "**/.next/"
            - "**/out/"
            - "**/.output/"
            - "**/.turbo/"
            - "**/.cache/"
            - "**/.parcel-cache/"
            - "**/.vite/"
            - "**/*.log"
            - "**/logs/"
            - .git/
            - .gitignore
            - docker/
            - Dockerfile*
            - docker-compose*.yml
            - .dockerignore
            - "**/.vscode/"
            - "**/.idea/"
            - "**/*.swp"
            - "**/*.swo"
            - "**/coverage/"
            - "**/.nyc_output/"
            - "**/.DS_Store"
            - "**/Thumbs.db"