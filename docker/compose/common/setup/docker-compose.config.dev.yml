# =====================================================================
# Setup DEV variant — INCLUDE-ONLY. Extends the setup base; carries the
# dev build, the watch block, and the dev healthcheck (the compose gate).
#
# THE HEALTHCHECK IS THE GATE, and it means "the API may start":
# `/setup/health` returns 503 until the wizard's details are persisted, and 200
# from then on. So `depends_on: { condition: service_healthy }` on `api-dev` is
# exactly "the operator finished onboarding" — no body parsing anywhere, and no
# cycle (setup never waits for the API).
# =====================================================================
services:
  setup:
    extends:
      file: ./docker-compose.config.yml
      service: setup
    build:
      context: ../../../..
      # ITS OWN Dockerfile, not the API's. The image is built from a PRUNED
      # workspace (`turbo prune <app>`), so the API's image does not contain
      # setup's dependency closure and the app dies on its first import:
      #   Cannot find package 'reflect-metadata' from '/app/apps/setup/src/main.ts'
      # Setup reuses the API's TOOLCHAIN, not its PRUNE.
      dockerfile: ./docker/builder/setup/Dockerfile.setup.dev
      tags:
        - "${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-setup-dev:latest"
      args:
        - BUILDKIT_INLINE_CACHE=1
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      # Dev: compose owns the API, so setup resolves the address compose fills
      # in. It is stable and known, which is why prod is the mode that creates
      # one instead.
      SETUP_MODE: ${SETUP_MODE:-dev}
      SETUP_API_URL: ${SETUP_API_URL:-http://api-dev:${API_PORT:-3005}}
      CHOKIDAR_USEPOLLING: "true"
    # ── NO `command:` OVERRIDE ────────────────────────────────────────────────
    # The image's CMD (docker/builder/setup/Dockerfile.setup.dev) carries the
    # ordering that makes dev boot reliable: it starts the package watchers, waits
    # for them to produce a resolvable tree, THEN starts the app.
    #
    # An earlier version of this file set `command:` to a plain
    # `turbo run dev --filter=setup...`, which REPLACED that CMD with the racing
    # one — so the fix in the Dockerfile never ran and setup died on
    #   Cannot find module '@repo/ui/components/setup/setup-wizard'
    #   from '/app/apps/setup/src/views/pages/setup.tsx'
    # A compose `command:` is a full REPLACEMENT, not a patch; when the ordering
    # lives in the image, overriding the command silently discards it.
    #
    # The `.env` loading the override existed for now happens inside the CMD,
    # which is also where it belongs: it is part of starting the app.
    # NO `ports:` — reached through Traefik only (see the base config).
    healthcheck:
      # THE GATE. Terminus emits a real status code, so `wget --spider` is a
      # correct probe: 503 while the wizard is still collecting, 200 once the
      # details are persisted and the API may start.
      #
      # It does NOT wait for the API — the API is what this gate enables, so
      # waiting for it would be a cycle. See `SetupGateService`.
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3016/setup/health || exit 1
      # Short: the gate opens when the OPERATOR finishes the wizard, so this
      # start_period only covers this container's own boot.
      start_period: 15s
      # Generous on purpose: the gate stays closed for as long as the operator
      # takes to fill in the form, which is unbounded. Too few retries would
      # mark the container unhealthy on a slow human, filling the logs with
      # false alarms. `depends_on: service_healthy` waits for the transition
      # regardless, so this only affects how noisy the wait is.
      interval: 10s
      timeout: 5s
      retries: 300
    develop:
      watch:
        # Rebuild when dependency or config files change.
        - action: rebuild
          path: ../../../..
          target: /app
          include:
            - package.json
            - bun.lock*
            - turbo.json
            - apps/setup/package.json
            - apps/setup/tsconfig.json
            - apps/setup/nest-cli.json
            - apps/setup/vite.config.ts
            - docker/builder/api/Dockerfile.api.dev
            - docker/compose/common/setup/**
            - packages/**/package.json
        # Sync source code, excluding build artifacts and the usual noise.
        - action: sync
          initial_sync: true
          path: ../../../..
          target: /app
          ignore:
            - node_modules/
            - "**/node_modules/"
            - bun.lock*
            - package-lock.json
            - yarn.lock
            - pnpm-lock.yaml
            - "**/dist/"
            - "**/build/"
            - "**/.next/"
            - "**/.turbo/"
            - "**/.cache/"
            - "**/.vite/"
            - "**/*.log"
            - .git/
            - .gitignore
            - docker/
            - Dockerfile*
            - docker-compose*.yml
            - .dockerignore
            - "**/.vscode/"
            - "**/.idea/"
            - "**/*.swp"
            - "**/coverage/"
            - "**/.DS_Store"
