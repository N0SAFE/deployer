# =====================================================================
# Setup PROD variant — INCLUDE-ONLY. Extends the setup base; carries the
# prod build and the healthcheck that the prod compose gates on.
#
# WHAT IS DIFFERENT FROM dev
# `SETUP_MODE=prod` changes one thing and one thing only: instead of waiting for
# a compose-managed API, setup CREATES the API as a swarm service from
# `DEPLOYER_API_IMAGE`. Everything downstream — the readiness gate, the ingress
# retarget, the exit — is identical, which is the point: the local path is a
# faithful rehearsal of a real deployment.
#
# NO `ports:` — reached through Traefik only (see the base config). Especially
# true here: this container holds the docker socket so it can found a swarm.
# =====================================================================
services:
  setup:
    # The setup app's OWN image, not the API's.
    #
    # Using the API image here (with a CMD override) would work but ship the
    # whole product surface into a pre-auth container — see the Dockerfile's
    # header. `turbo prune setup` resolves setup's graph, so this image contains
    # the wizard and its packages and nothing else.
    build:
      context: ../../../..
      dockerfile: ./docker/builder/setup/Dockerfile.setup.prod
      tags:
        - "${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-setup-prod:latest"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      SETUP_MODE: "prod"
      # The tag setup schedules. Produced by the `build-api` service in
      # docker-compose.prod.yml, or pulled from a registry in a real deploy —
      # setup does not care which, it receives the reference and schedules it.
      DEPLOYER_API_IMAGE: ${DEPLOYER_API_IMAGE:-deployer-api:local}
      DEPLOYER_API_REPLICAS: ${API_REPLICAS:-1}
      # The API's INTERNAL port. Read rather than hardcoded because dev publishes
      # 3005 and prod 3001, so a constant would be right in one and produce an
      # unreachable ingress backend in the other.
      SETUP_API_PORT: ${API_PORT:-3001}
      # NOTHING RUNS TRAEFIK IN THIS PROFILE — the API is a swarm task that setup
      # itself schedules, so it cannot supervise the ingress before it exists. So
      # SETUP runs the bootstrap ingress; without it this app is unreachable (it
      # publishes no ports, and publishing them would expose the pre-auth wizard),
      # the wizard can never be completed, and the gate never opens. The API's
      # supervisor promotes the ingress to a swarm GLOBAL service after the gate.
      MANAGED_TRAEFIK_ENABLED: "false"
      # ── THE PLATFORM'S SHARED AUTH SECRET, WHICH A TASK CANNOT INHERIT ──────
      # Setup FORWARDS this into every service it schedules. A swarm task inherits
      # nothing from this compose project, so the managed web console — whose env
      # schema REQUIRES it (`min(1)`, unlike the API's optional one) — crash-looped
      # with no running task and nothing in the supervisor's report saying why:
      #
      #   ✖ Invalid input: expected string, received undefined → at AUTH_SECRET
      #
      # The SAME value must reach the API (it signs the session cookie) and the
      # web app (its middleware decrypts it), so it is forwarded rather than
      # defaulted independently in each task. NO FALLBACK here on purpose:
      # production already refuses to boot without a real secret
      # (`schema-codecs.ts`), so a silent default would only move the failure.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required in production}
    healthcheck:
      # The compose gate for `web-prod`, which cannot observe a swarm task. 200
      # only once setup has watched the API turn green AND handed the ingress
      # over — so `service_healthy` here means "the platform is converged".
      #
      # NOTE this is a LATER gate than the one `api-dev` uses in dev: there, the
      # gate means "the API may start" (compose starts the API itself). Here
      # setup both opens the gate and schedules the task, so the same endpoint
      # is also the final readiness signal.
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3016/setup/health || exit 1
      # Long: a prod boot founds a swarm, schedules the API task, waits for
      # migrations and admin bootstrap on a cold database, then hands over.
      start_period: 60s
      interval: 15s
      timeout: 10s
      retries: 60
