# =====================================================================
# WireGuard BASE config — INCLUDE-ONLY (real base: image, cap_add, overlay
# env defaults, module volume). The mesh-6 orchestrators EXTEND this once
# per node to stamp out wireguard-mesh-1..6 with a per-node overlay IP /
# private key / peers / state volume.
# =====================================================================
services:
  wireguard:
    image: ${MANAGED_WIREGUARD_IMAGE:-linuxserver/wireguard:latest}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: "0"
      PGID: "0"
      TZ: UTC
      SERVERURL: auto
      SERVERPORT: ${MANAGED_WIREGUARD_PORT:-51820}
      PRIVATE_KEY: ${MANAGED_WIREGUARD_PRIVATE_KEY:-}
      OVERLAY_IP: ${MANAGED_WIREGUARD_IP:-10.0.0.1}
      PEERS: ${MANAGED_WIREGUARD_PEERS:-}
    volumes:
      - /lib/modules:/lib/modules:ro