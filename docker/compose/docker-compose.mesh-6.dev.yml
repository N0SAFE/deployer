# Mesh-6 dev compose — extends the normal dev stack with 5 additional
# API nodes that form a 6-node cluster.
#
# This file uses `include` to pull in the regular dev compose (api-dev,
# web-dev, doc, load-balancer, dev DB, …) unchanged. We then:
#
#   1. Override the `api-dev` env to make it the **first** node of the
#      cluster (MESH_NODE_ID_NODE_1) and point the bootstrap peers at
#      the 5 extra nodes we're about to add.
#   2. Add 5 new services — `api-mesh-dev-1`..`api-mesh-dev-5` — that
#      connect to the **same** Postgres (api-db-dev) and register
#      themselves on startup via the entrypoint's
#      `register-mesh-node` step (idempotent).
#   3. Override `web-dev` env so the browser talks to node 1.
#
# Each mesh node has its own SQLite (NODE_LOCAL_DB_PATH) and its own
# uploads volume, but they all share the global Postgres — which is
# what makes them a real "mesh" of nodes backed by a single
# coordinated database.
#
# Usage:
#   bun run mesh:dev             # full stack + 5 extra mesh nodes
#   bun run mesh:dev:down        # stop
#   bun run mesh:dev:down:volumes  # stop + wipe Postgres data
#
# Note: the `api-dev` is still the "node 1" wired to web-dev. The 5
# extra nodes (api-mesh-dev-1..5) participate in the mesh ring but
# are not directly addressable from the browser. Connect a remote
# client to any one of them by hitting their `:3301`-`:3305` host
# port (see MESH_API_PORT_* env vars).

include:
  - path:
      - docker-compose.dev.yml

# ─────────────────────────────────────────────────────────────────────
# 1. Override api-dev so it becomes the FIRST node of the cluster
# ─────────────────────────────────────────────────────────────────────
services:
  # First node of the mesh — the api-dev that web-dev already talks to.
  api-dev:
    environment:
      # Mark api-dev as cluster member #1 so the mesh ring has 6 nodes
      # total (api-dev + 5 api-mesh-dev-1..5).
      - MESH_CLUSTER_ID=${MESH_CLUSTER_ID:-11111111-1111-4111-8111-111111111111}
      - MESH_NODE_ID=${MESH_NODE_ID_NODE_1:-22222222-2222-4222-8222-222222222222}
      - MESH_NODE_SERVER_URL=${MESH_NODE_SERVER_URL_NODE_1:-http://api-dev:${API_PORT:-3005}}
      # Bootstrap peers — 5 of the 6 ring members (excluding ourselves).
      - MESH_BOOTSTRAP_PEERS=${MESH_BOOTSTRAP_PEERS_NODE_1:-33333333-3333-4333-8333-333333333333@ws://api-mesh-dev-1:3301/mesh,44444444-4444-4444-8444-444444444444@ws://api-mesh-dev-2:3302/mesh,55555555-5555-4555-8555-555555555555@ws://api-mesh-dev-3:3303/mesh,66666666-6666-4666-8666-666666666666@ws://api-mesh-dev-4:3304/mesh,77777777-7777-4777-8777-777777777777@ws://api-mesh-dev-5:3305/mesh}
      - MESH_STREAM_SHARED_SECRET=${MESH_STREAM_SHARED_SECRET:-dev-mesh-stream-secret}
    networks:
      app_network_dev:
        aliases:
          - api-dev
          - api
          # Expose api-dev on the same aliases so mesh-dev-N can dial it.
          - mesh-node-1

  # ───────────────────────────────────────────────────────────────
  # 2. Five additional mesh nodes — share the same DB and image.
  # ───────────────────────────────────────────────────────────────
  # Each one:
  #   - Uses the same `api-dev` image (already built by docker-compose.dev.yml)
  #   - Connects to the existing `api-db-dev` Postgres (no separate DB)
  #   - Gets its own SQLite path (NODE_LOCAL_DB_PATH) so per-node
  #     local state (node_config, …) is isolated
  #   - Exposes its API on MESH_API_PORT_1..5
  #   - Wires itself into the mesh ring via MESH_BOOTSTRAP_PEERS
  #
  # The `register-mesh-node` step in entrypoint.dev.ts is idempotent
  # and runs on every startup, so these nodes are pre-registered in
  # `cluster_nodes` the first time the cluster boots — no manual
  # bootstrap needed.

  api-mesh-dev-1:
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-mesh-dev-1
    image: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-dev:latest
    pull_policy: never
    depends_on:
      api-dev:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${MESH_API_PORT_1:-3301}:3301"
    command: ["sh", "-c", "cd apps/api && bun src/cli.ts migrate && bun run dev"]
    volumes:
      - api_local_db_data_dev:/app/data
      - api_uploads_mesh_dev_1:/app/apps/api/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@api-db-dev:5432/${DB_DATABASE:-nestjs_api}
      - API_PORT=3301
      - LOG_LEVEL=debug
      - DOCKER_HOST=unix:///var/run/docker.sock
      - APP_URL=http://web-dev:3000
      - API_URL=http://api-mesh-dev-1:3301
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3301}
      - AUTH_SECRET=${AUTH_SECRET:-fallback-auth-secret}
      - BETTER_AUTH_SECRET=${AUTH_SECRET:-fallback-auth-secret}
      - AUTH_BASE_DOMAIN=${AUTH_BASE_DOMAIN:-http://localhost}
      - DEV_AUTH_KEY=${DEV_AUTH_KEY:-dev-fallback-key}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      - PASSKEY_RPID=${PASSKEY_RPID:-localhost}
      - PASSKEY_RPNAME=${PASSKEY_RPNAME:-NestJS App}
      - PASSKEY_ORIGIN=${PASSKEY_ORIGIN:-http://localhost:3000}
      - UPLOADS_DIR=/app/apps/api/uploads
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@admin.com}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-adminadmin}
      # Mesh nodes don't need seeding — they join a DB that's already
      # initialized by the api-db-seed-dev one-shot.
      - ENABLE_SEEDING=false
      - CHOKIDAR_USEPOLLING=true
      - NODE_LOCAL_DB_PATH=/app/data/local-mesh-node-1.db
      - MESH_CLUSTER_ID=${MESH_CLUSTER_ID:-11111111-1111-4111-8111-111111111111}
      - MESH_NODE_ID=${MESH_NODE_ID_NODE_2:-33333333-3333-4333-8333-333333333333}
      - MESH_NODE_SERVER_URL=${MESH_NODE_SERVER_URL_NODE_2:-http://api-mesh-dev-1:3301}
      # Bootstrap peers — node 1 (api-dev) + 4 of the other mesh-dev
      # nodes. Self is excluded.
      - MESH_BOOTSTRAP_PEERS=${MESH_BOOTSTRAP_PEERS_NODE_2:-22222222-2222-4222-8222-222222222222@ws://api-dev:3005/mesh,44444444-4444-4444-8444-444444444444@ws://api-mesh-dev-2:3302/mesh,55555555-5555-4555-8555-555555555555@ws://api-mesh-dev-3:3303/mesh,66666666-6666-4666-8666-666666666666@ws://api-mesh-dev-4:3304/mesh,77777777-7777-4777-8777-777777777777@ws://api-mesh-dev-5:3305/mesh}
      - MESH_STREAM_SHARED_SECRET=${MESH_STREAM_SHARED_SECRET:-dev-mesh-stream-secret}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3301/health || exit 1
      start_period: 15s
      interval: 15s
      timeout: 15s
      retries: 5
    networks:
      app_network_dev:
        aliases:
          - api-mesh-dev-1
          - mesh-node-2

  api-mesh-dev-2:
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-mesh-dev-2
