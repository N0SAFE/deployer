# =====================================================================
# MESH-6 DEV — 6-node mesh cluster on the compose-managed dev stack.
#
# Each api-N EXTENDS the same common api DEV base (build, env,
# develop.watch) and overrides only the mesh-node-specific bits:
#   ports, healthcheck (per-node port), container_name, NODE_LOCAL_DB_PATH,
#   MESH_NODE_ID / SERVER_URL / BOOTSTRAP_PEERS, wireguard overlay IP.
# WireGuard sidecars likewise EXTEND the common wireguard base once per node.
# =====================================================================

name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-mesh-6-dev

services:
  # ── Node 1 — the primary (web-dev talks to this one) ─────────────
  api-1:
    extends:
      file: ./common/api/docker-compose.config.dev.yml
      service: api
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-mesh-dev-1
    ports:
      - "${MESH_API_PORT_1:-3301}:3301"
    environment:
      API_PORT: "3301"
      API_URL: http://api-mesh-dev-1:3301
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3301}
      SETUP_DATABASE_URL: ${MANAGED_GLOBAL_DB_URL:-postgresql://deployer:deployer@global-db:5432/deployer}
      MANAGED_GLOBAL_DB_ENABLED: "true"
      SETUP_AUTO: "true"
      MANAGED_REDIS_ENABLED: "true"
      MANAGED_LOCAL_DB_ENABLED: "true"
      MANAGED_TRAEFIK_ENABLED: "false"
      APP_URL: http://web-dev:3000
      ENABLE_SEEDING: ${ENABLE_SEEDING:-false}
      NODE_LOCAL_DB_PATH: /app/data/local-mesh-node-1.db
      MESH_NODE_ID: ${MESH_NODE_ID_NODE_1:-22222222-2222-4222-8222-222222222222}
      MESH_NODE_SERVER_URL: ${MESH_NODE_SERVER_URL_NODE_1:-http://api-mesh-dev-1:3301}
      MESH_BOOTSTRAP_PEERS: ${MESH_BOOTSTRAP_PEERS_NODE_1:-33333333-3333-4333-8333-333333333333@ws://api-mesh-dev-2:3302/mesh,44444444-4444-4444-8444-444444444444@ws://api-mesh-dev-3:3303/mesh,55555555-5555-4555-8555-555555555555@ws://api-mesh-dev-4:3304/mesh,66666666-6666-4666-8666-666666666666@ws://api-mesh-dev-5:3305/mesh,77777777-7777-4777-8777-777777777777@ws://api-mesh-dev-6:3306/mesh}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3301/health || exit 1
      start_period: 15s
      interval: 15s
      timeout: 15s
      retries: 5
    networks:
      app_network_dev:
        aliases:
          - api-mesh-dev-1
          - mesh-node-1
      deployer_platform: {}
      shared: {}

