services:
  api-db-mesh-dev:
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-db-mesh-dev
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${DB_DATABASE:-nestjs_api}
    volumes:
      - api_db_data_mesh_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_DATABASE:-nestjs_api}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      mesh_network_dev:
        aliases:
          - api-db-mesh-dev

  api-mesh-dev-1:
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-mesh-dev-1
    build:
      context: ../..
      dockerfile: ./docker/builder/api/Dockerfile.api.dev
    depends_on:
      api-db-mesh-dev:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 6g
    memswap_limit: 6g
    ports:
      - "${MESH_API_PORT_1:-3301}:3301"
    volumes:
      - bun_cache_mesh_dev:/root/.bun/install/cache
      - turbo_cache_mesh_dev:/root/.cache/turbo
      - api_uploads_mesh_dev_1:/app/apps/api/uploads
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@api-db-mesh-dev:5432/${DB_DATABASE:-nestjs_api}
      - API_PORT=3301
      - LOG_LEVEL=debug
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - APP_URL=http://web-mesh-dev:3000
      - API_URL=http://api-mesh-dev-1:3301
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3301}
      - AUTH_SECRET=${AUTH_SECRET:-fallback-auth-secret}
      - BETTER_AUTH_SECRET=${AUTH_SECRET:-fallback-auth-secret}
      - AUTH_BASE_DOMAIN=${AUTH_BASE_DOMAIN:-http://localhost}
      - DEV_AUTH_KEY=${DEV_AUTH_KEY:-dev-fallback-key}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      - PASSKEY_RPID=${PASSKEY_RPID:-localhost}
      - PASSKEY_RPNAME=${PASSKEY_RPNAME:-NestJS App}
      - PASSKEY_ORIGIN=${PASSKEY_ORIGIN:-http://localhost:3000}
      - UPLOADS_DIR=/app/apps/api/uploads
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@admin.com}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-adminadmin}
      - ENABLE_SEEDING=true
      - CHOKIDAR_USEPOLLING=true
      - TURBO_TOKEN=${TURBO_TOKEN}
      - TURBO_TEAM=${TURBO_TEAM}
      - MESH_CLUSTER_ID=${MESH_CLUSTER_ID:-11111111-1111-4111-8111-111111111111}
      - MESH_NODE_ID=${MESH_NODE_ID_NODE_1:-22222222-2222-4222-8222-222222222222}
      - MESH_STREAM_SHARED_SECRET=${MESH_STREAM_SHARED_SECRET:-dev-mesh-stream-secret}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3301/health || exit 1
      start_period: 15s
      interval: 15s
      timeout: 15s
      retries: 5
    networks:
      mesh_network_dev:
        aliases:
          - api-mesh-dev-1

