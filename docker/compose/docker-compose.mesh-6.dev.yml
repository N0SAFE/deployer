      PRIVATE_KEY: ${MANAGED_WIREGUARD_PRIVATE_KEY_1:-${MANAGED_WIREGUARD_PRIVATE_KEY:-}}
      PEERS: ${MANAGED_WIREGUARD_PEERS_1:-${MANAGED_WIREGUARD_PEERS:-}}
    volumes:
      - wireguard-state-mesh-1:/config
      - /lib/modules:/lib/modules:ro
