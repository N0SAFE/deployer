  # ── Build-only: produces the mesh agent image, then exits ───────────────
  #
  # The agent is NOT a compose service: setup starts it as a plain host-network
  # container (`deployer-mesh-agent`) from `MESH_AGENT_IMAGE`, because it must
  # exist before the swarm does. Compose's only job is to make that TAG exist.
  #
  # `entrypoint` (not `command`) is overridden: the image's ENTRYPOINT is the
  # agent binary itself, so a `command:` would only become its arguments and
  # this producer would start an agent with no NET_ADMIN and never exit.
  # `restart: "no"` is required — the default policy would loop it forever.
  build-mesh-agent:
    build:
      context: ../../..
      dockerfile: ./infra/docker/builder/mesh-agent/Dockerfile.mesh-agent
      args:
        - BUILDKIT_INLINE_CACHE=1
    # The SAME variable setup and the API nodes read, so the image compose
    # built and the image the node runs cannot drift into two tags.
    image: ${MESH_AGENT_IMAGE:-deployer-mesh-agent:dev}
    entrypoint: ["echo", "mesh agent image built: ${MESH_AGENT_IMAGE:-deployer-mesh-agent:dev}"]
    restart: "no"

networks:
  app_network_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_app_network_dev
    driver: bridge
  deployer_platform:
    name: deployer-platform
    driver: bridge

volumes:
  # The dependency-builder's output volume — the shared packages the
  # applications import (separate from Turbo's own task cache).
  dep_output_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_dep_output_dev
  api_local_db_data_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_api_local_db_data_dev
  bun_cache_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_bun_cache_dev
  turbo_cache_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_turbo_cache_dev
  api_uploads_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_api_uploads_dev
  web_instance_token_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_web_instance_token_dev
  deployer-traefik-config:
    name: ${TRAEFIK_CONFIG_VOLUME:-deployer-traefik-config}
  # The mesh agent's control-socket volume (`/run/deployer-mesh/agent.sock`).
  # NAMED LITERALLY, never project-prefixed: the agent container and the API
  # swarm service mount it by this exact name, so setup and the API nodes must
  # mount the same one.
  deployer-mesh-run:
    name: deployer-mesh-run
