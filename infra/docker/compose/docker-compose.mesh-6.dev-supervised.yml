# =====================================================================
# MESH-6 DEV-SUPERVISED — 6-node mesh, API owns the platform services
# (no compose-managed global-db / redis / traefik — like prod but built
# from the DEV api image in watch/dev mode). Nodes EXTEND the api DEV
# base one per node.
#
# NO WIREGUARD SIDECARS. The mesh is a per-node `deployer-mesh-agent`
# (docs/edge-mesh-architecture.md): a plain host-network container that
# SETUP starts from `MESH_AGENT_IMAGE`, not a compose service. Compose only
# PRODUCES its image (`build-mesh-agent`) and mounts its control-socket
# volume (`deployer-mesh-run`) into setup and every API node.
# =====================================================================

name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-mesh-6-dev-supervised

services:

  # ── Setup — the GATE and the swarm founder ────────────────────────
  #
  # Setup founds the swarm for the whole mesh and gates node 1, because this
  # app is a CONVERGED-PLATFORM process: it reads the onboarding decision from
  # `node_config` and provisions itself. Without setup the mesh has no cluster
  # founder and every node would start with no database URL.
  #
  # ONLY node 1 is gated, because nodes 2..6 already `depends_on: api-1` — so
  # the chain is setup → api-1 → api-2..6, one direction, no cycle.
  setup-dev:
    extends:
      file: ./common/setup/docker-compose.config.dev.yml
      service: setup
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-setup-dev
    depends_on:
      # Setup starts the node's mesh agent from this tag before it founds the
      # swarm, so the image has to exist first.
      build-mesh-agent:
        condition: service_completed_successfully
    environment:
      SETUP_MODE: "dev"
      # Node 1 is the primary (web talks to it), so it is the address setup
      # reports and retargets the ingress at.
      SETUP_API_URL: http://api-mesh-dev-1:3301
      SETUP_API_PORT: "3301"
      DEPLOYER_PREFIX: ${DEPLOYER_PREFIX:-}
      # The tag `build-mesh-agent` below produces — not the `:latest` default.
      MESH_AGENT_IMAGE: ${MESH_AGENT_IMAGE:-deployer-mesh-agent:dev}
      MESH_AGENT_DATAPLANE: ${MESH_AGENT_DATAPLANE:-observe}
    # NO `ports:` — internal only, reached through Traefik.
    volumes:
      - api_local_db_data_dev:/app/data
    networks:
      app_network_dev:
        aliases:
          - setup-dev
          - setup
      deployer_platform:
        aliases:
          - setup-dev
          - setup
  api-1:
    extends:
      file: ./common/api/docker-compose.config.dev.yml
      service: api
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-api-mesh-dev-1
