# =====================================================================
# SERVICES DEV-SUPERVISED — the MICROSERVICES tier, supervised by the swarm.
#
# ── WHAT COMPOSE DOES HERE ─────────────────────────────────────────────────
# The supervised counterpart of `docker-compose.services.dev.yml`, and
# nothing else:
#
#   1. BUILD THE IMAGES. `build-svc-<name>` are IMAGE PRODUCERS: each builds,
#      prints the tag it produced, and EXITS. `restart: "no"` is what keeps them
#      from looping.
#   2. RUN SETUP. `setup-dev` is the ONLY long-running service. It founds the
#      cluster, schedules the tier onto it, streams both steps to the wizard, and
#      hands over.
#
# Compose therefore manages NO platform service — no global database, no Redis,
# no Traefik, no BFF, no `svc-*` container. The PLATFORM supervises all of those
# once its apps are scheduled. A compose-managed `svc-identity` container would
# belong to no cluster, so it would have no placement, no restart policy across
# nodes and no `docker service ls` visibility — i.e. it would silently not be the
# thing this profile exists to exercise.
#
# ── WHAT IS DIFFERENT FROM THE MONOLITH PROFILE ────────────────────────────
# ONE app image becomes SEVEN. That is the whole difference, and it is why setup
# receives `DEPLOYER_BFF_IMAGE` plus a tag per service: setting the BFF tag is
# what tells setup "this node is the microservices tier, schedule the tier"
# instead of "schedule the monolith".
#
# ── WHERE THE TIER IS SCHEDULED ────────────────────────────────────────────
# `ServicesTierProvisioner` (apps/setup) creates the BFF and the five services as
# swarm services on the platform overlay, then `ApiServiceProvisioner` hands over
# to the BFF's DNS name. Both are ONE-SHOT acts inside onboarding; the BFF's own
# supervisors then own the continuous work (database, Redis, ingress).
#
# ── ALWAYS START THIS PROFILE WITH `--build` ───────────────────────────────
# `up` WITHOUT `--build` fails on a clean machine, or after `docker image prune`:
#
#   Error response from daemon: No such image: deployer-svc-bff:dev
#   Error response from daemon: No such image: deployer-svc-project:dev
#
# ── WHY, AND WHY IT IS NOT OBVIOUS ────────────────────────────────────────
# The seven `build-*` services are IMAGE PRODUCERS: each builds, echoes its tag,
# and exits 0. Compose records that exit as `service_completed_successfully`, so
# on the NEXT `up` every producer is considered already-satisfied and is neither
# re-run nor rebuilt. That is correct for a cache — except the artifact a producer
# creates is a TAG, and a tag can disappear (`image prune`, a disk reclaim, a new
# machine) while the exited CONTAINER that "proved" it still exists.
#
# So the gate says "the image is built" when it is not, and `setup-dev` starts
# against a tag nothing can pull.
#
# `--build` re-runs the producers unconditionally and is a no-op (layer cache) when
# the images are current, which is why the documented command always passes it:
#
#   bun run dev:services:supervised          # script includes --build
#   docker compose ... up -d --build         # raw equivalent
#
# The alternative — making the images `depends_on`-independent — was rejected: a
# swarm-scheduled app cannot be handed a compose volume, so the images MUST be
# baked by these producers, and there is no cheaper way to prove a tag exists.
#
# ── PROFILES: WHICH IMAGES THIS RUN PRODUCES ───────────────────────────────
#   COMPOSE_PROFILES=all       setup + every app image (the default)
#   COMPOSE_PROFILES=services  setup + the tier images
#   COMPOSE_PROFILES=web       additionally the web image
#
# A profile selects which IMAGES are produced, not which containers stay up.
# `setup-dev` carries every profile because it is the entry point, and the build
# services it gates on carry them too — a `depends_on` to a profile-inactive
# service invalidates the whole project.
# =====================================================================

name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-supervised

# ── NEVER PULL: EVERY IMAGE IN THIS FILE IS BUILT LOCALLY ──────────────────
# Compose's default policy is `missing`, but for a service that carries BOTH
# `build:` and `image:` it still tries the registry first and only falls back to
# building. With `deployer-svc-*:dev` tags that produces a wall of noise on every
# start — and it is not harmless, it delays the boot by a failed auth round-trip
# per image:
#
#   Image deployer-svc-bff:dev pull access denied for deployer-svc-bff,
#     repository does not exist or may require 'docker login'
#   Image deployer-svc-health:dev pull access denied …
#   (…eight more)
#
# `never` states the truth: these tags exist only on this machine. It also makes
# a genuinely missing image fail LOUDLY (`No such image`) instead of being masked
# behind a pull attempt that cannot succeed.
#
# Set per-service rather than globally because compose has no top-level key for it,
# and it must not leak into profiles that DO pull (`postgres:16-alpine`).
x-no-pull: &no-pull
  pull_policy: never

services:
  # ── Setup: THE GATE AND THE SWARM FOUNDER ──────────────────────────────
  setup-dev:
    extends:
      file: ./common/setup/docker-compose.config.dev.yml
      service: setup
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-setup-dev
    # The entry point, so every profile selects it.
    profiles: ["all", "services", "web"]
    # ── NO dep-output MOUNT, AND THE PACKAGES ARE BAKED ────────────────────
    # This profile is swarm-managed: there is no `dependency-builder` service to
    # produce the shared volume, and the apps are SCHEDULED — a scheduled task
    # cannot be handed a compose volume.
    #
    # `!override` REPLACES the inherited list rather than appending to it: the
    # inherited `dep_output_dev` entry disappears, without which compose rejects
    # the whole project with `refers undefined volume dep_output_dev`.
    build:
      args:
        - APP_DEPS_MODE=baked
        # ── SETUP IS THE ONE APP THAT CANNOT DROP ITS devDependencies ──────
        # The six `svc-*` images set this to 1 because they start with
        # `bun --bun src/main.ts` and bun transpiles TS itself, so their toolchain
        # is build-time only. Setup does NOT: its image CMD is `bun run dev`
        # (Dockerfile.app.dev), which runs `scripts/entrypoint.dev.ts` and spawns
        # BOTH `dev:vite` and `dev:nest`. Setup is a Vite SSR app — `@deployer/vite-assets`
        # proxies `/vite/` to a listener on 5174, and with nothing there the wizard
        # renders inert HTML with every asset 404ing.
        #
        # Stripping devDependencies therefore removed `vite` from node_modules and
        # the container crash-looped on every start:
        #   error: script "dev:vite" exited with code 127
        #   error: script "dev" exited with code 127 (restarting)
        # 127 = command not found, and NOTHING in the wizard's logs said "vite is
        # missing" — the failure looked like a setup bug, not a packaging one.
        #
        # `SETUP_MODE=prod` describes OWNERSHIP (who schedules the apps), not the
        # app's build mode, so it is no licence to strip the wizard's toolchain.
        - APP_INSTALL_PRODUCTION=0
    depends_on:
      # Only IMAGES are prerequisites. Setup itself founds the swarm, so it cannot
      # wait for anything cluster-related — that IS the work.
      #
      # ALL SIX build services, and every one carries every profile for the same
      # reason: `setup-dev` gates on them, so a profile selecting setup without one
      # of its dependencies is a project compose rejects outright.
      build-svc-bff:
        condition: service_completed_successfully
      build-svc-health:
        condition: service_completed_successfully
      build-svc-identity:
        condition: service_completed_successfully
      build-svc-project:
        condition: service_completed_successfully
      build-svc-fleet:
        condition: service_completed_successfully
      build-svc-runtime:
        condition: service_completed_successfully
      # Setup starts the node's mesh agent from this tag BEFORE it founds the
      # swarm (the swarm binds the mesh address), so it must exist first too.
      build-mesh-agent:
        condition: service_completed_successfully
    environment:
      # ── PROD'S FLOW, RUNNING DEV IMAGES ────────────────────────────────
      # `SETUP_MODE=prod` — NOT `dev`. It describes OWNERSHIP ("who starts the
      # apps"), not the address source. Compose manages no app here, so setup must
      # schedule them; `dev` would make it wait for a compose-managed API this
      # profile never starts, and the flow would stall.
      SETUP_MODE: "prod"
      # The BFF is the public surface. The host is a PORT CARRIER: in prod mode the
      # resolver replaces it with the swarm service name and keeps the port.
      SETUP_API_URL: http://svc-bff:${API_PORT:-3005}
      SETUP_API_PORT: ${API_PORT:-3005}
      # ── THE SWITCH: ONE TAG SAYS "THIS NODE IS THE MICROSERVICES TIER" ──
      # `ApiServiceProvisioner` refuses to hand over in prod without it, and
      # delegates to `ServicesTierProvisioner`. Produced by `build-svc-bff` below and read by setup — the SAME variable in
      # both places, so "the image compose built" and "the image the platform
      # schedules" cannot drift into two tags.
      DEPLOYER_BFF_IMAGE: ${DEPLOYER_BFF_IMAGE:-deployer-svc-bff:dev}
      DEPLOYER_SVC_HEALTH_IMAGE: ${DEPLOYER_SVC_HEALTH_IMAGE:-deployer-svc-health:dev}
      DEPLOYER_SVC_IDENTITY_IMAGE: ${DEPLOYER_SVC_IDENTITY_IMAGE:-deployer-svc-identity:dev}
      DEPLOYER_SVC_PROJECT_IMAGE: ${DEPLOYER_SVC_PROJECT_IMAGE:-deployer-svc-project:dev}
      DEPLOYER_SVC_FLEET_IMAGE: ${DEPLOYER_SVC_FLEET_IMAGE:-deployer-svc-fleet:dev}
      DEPLOYER_SVC_RUNTIME_IMAGE: ${DEPLOYER_SVC_RUNTIME_IMAGE:-deployer-svc-runtime:dev}
      DEPLOYER_SVC_REPLICAS: ${DEPLOYER_SVC_REPLICAS:-1}
      # The tag setup RUNS the node's mesh agent from (a plain host-network
      # container, not a swarm service). The setup default is `:latest`, which no
      # dev producer tags.
      MESH_AGENT_IMAGE: ${MESH_AGENT_IMAGE:-deployer-mesh-agent:dev}
      # Workstations do not bring up a host WireGuard interface on every start.
      # Set `kernel` to exercise the real dataplane.
      MESH_AGENT_DATAPLANE: ${MESH_AGENT_DATAPLANE:-observe}
      # Tags setup FORWARDS to the tier it schedules. The apps' own fallbacks are
      # `:latest`, which no dev producer tags.
      MANAGED_WEB_APP_IMAGE: ${MANAGED_WEB_APP_IMAGE:-deployer-web:dev}
      DEPLOYER_TRAEFIK_IMAGE: ${DEPLOYER_TRAEFIK_IMAGE:-traefik:v3.6.10}
      DEPLOYER_REDIS_IMAGE: ${DEPLOYER_REDIS_IMAGE:-redis:7-alpine}
      # ── THE WEB APP, SUPERVISED LIKE EVERYTHING ELSE ────────────────────
      # Earlier this profile set ENABLED=false + EXTERNAL=true, on the theory that
      # compose would run the dashboard itself. It does not: this file has no
      # `web-dev` runtime service, only the `build-web` IMAGE PRODUCER. So the two
      # flags together said "the dashboard is somebody else's job" while nobody had
      # it, and `PlatformWebTargetService.resolveWebTarget()` returned null for
      # exactly two reasons — EXTERNAL short-circuits first, and ENABLED would have
      # been false anyway.
      #
      # `null` means no router is written, so `web.deployer.localhost` had no
      # `platform-web` router AT ALL and Traefik answered its own 502. Measured on
      # a completed run: dynamic-api.yml and dynamic-setup.yml existed, there was
      # no dynamic-web.yml, api.<host> was 200 and web.<host> was 502.
      #
      # The whole point of this profile is that the PLATFORM supervises the apps,
      # and the dashboard is no exception: the BFF's ManagedWebSupervisorService
      # schedules `deployer-managed-web` onto the overlay with the right env and
      # `dnsrr` on the service name the resolver returns. So ENABLED is on and
      # EXTERNAL is off, which is the combination that makes the resolver answer.
      #
      # `MANAGED_WEB_APP_IMAGE` is already set above and forwarded by the tier
      # provisioner, so the swarm service pulls `deployer-web:dev` rather than the
      # `:latest` default that no dev producer tags.
      MANAGED_WEB_APP_ENABLED: "true"
      MANAGED_WEB_APP_EXTERNAL: "false"
      # ── NOTHING RUNS TRAEFIK HERE ───────────────────────────────────────
      # Compose manages no services in this profile, and the BFF that would
      # supervise the ingress cannot start until setup's gate opens. So SETUP runs
      # the bootstrap ingress; without it this app is unreachable (it publishes no
      # ports), the wizard can never be completed, and the gate never opens.
      MANAGED_TRAEFIK_ENABLED: "false"
      DEPLOYER_PREFIX: ${DEPLOYER_PREFIX:-}
      # ── THE SHARED NODE-STATE VOLUME, NAMED AS COMPOSE CREATED IT ──────
      # Setup schedules the tier and mounts this volume into those tasks, so it
      # must name the SAME volume this container writes. Compose prefixes volumes
      # with the project name, which setup cannot guess, so the resolved name is
      # passed in rather than reconstructed.
      #
      # ── ITS OWN VOLUME, NOT THE COMPOSE-OWNED PROFILE'S ────────────────
      # `node_config.database_url` is the ONE row that decides which database every
      # app talks to, and it is written by whichever profile onboarded this node.
      # Sharing it with `dev:services` therefore imports a URL that is WRONG here:
      #
      #   database_url = postgresql://…@nextjs-nestjs-global-db:5432/deployer
      #   database_provisioning = external
      #   setup_state = setup_done
      #
      # `nextjs-nestjs-global-db` is the COMPOSE container from the other profile.
      # Nothing runs it here — this profile exists so the PLATFORM supervises the
      # database — so the BFF booted, read that stale row, and crash-looped on
      #
      #   getaddrinfo ENOTFOUND nextjs-nestjs-global-db
      #   task: non-zero exit (1)   (svc-bff 0/N, restarting forever)
      #
      # A separate volume makes the two profiles independent: switching between
      # them on one workstation re-onboards instead of inheriting a foreign
      # database URL, and `external` cannot mask the provisioning this profile
      # is meant to exercise.
      NODE_LOCAL_DB_VOLUME: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_supervised_local_db
      # The ingress config volume, the same way — the input the tier publishes
      # routes into and the output Traefik reads.
      TRAEFIK_CONFIG_VOLUME: ${TRAEFIK_CONFIG_VOLUME:-deployer-traefik-config}
      # ── THE SHARED AUTH SECRET, WHICH A TASK CANNOT INHERIT ────────────
      # Setup forwards this into every app it schedules. A swarm task inherits
      # nothing from this compose project, and the apps require it: the BFF signs
      # the session cookie and the web app's middleware decrypts it, so one value
      # must reach both.
      AUTH_SECRET: ${AUTH_SECRET:-fallback-auth-secret}
    volumes: !override
      - supervised_local_db:/app/data
      # The bootstrap ingress writes routing here and Traefik reads it from the
      # same named volume. Omitting it makes every hostname a Traefik 404.
      - deployer-traefik-config:/app/traefik-configs
      # Setup starts the mesh agent and then talks to it over
      # `/run/deployer-mesh/agent.sock`, which lives in this volume.
      - deployer-mesh-run:/run/deployer-mesh
      # The clusters it creates live on the host engine, so it drives the socket.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      app_network_dev:
        aliases:
          - setup-dev
          - setup
      deployer_platform:
        aliases:
          - setup-dev
          - setup
      # NOTE: the swarm OVERLAY is deliberately NOT listed. Setup creates it at
      # RUNTIME (the same idempotent `ensureOverlayNetwork` the tier provisioner
      # calls), so declaring it here would make compose require a network that does
      # not exist until the container composing it has already started. Setup
      # attaches ITSELF once it exists.

  # ── IMAGE PRODUCERS, NOT RUNTIME SERVICES ──────────────────────────────
  #
  # Each starts, prints the tag it produced, and exits. `restart: "no"` is
  # required, not cosmetic: the default restart policy would loop them forever.
  #
  # `APP_DEPS_MODE=baked` throughout: these images are scheduled as SWARM
  # SERVICES, and a swarm service cannot be handed a compose volume of prebuilt
  # packages. Building them in makes each image self-contained.
  #
  # Two build args because a workspace holds two facts that stop agreeing for
  # services: `APP` is the PACKAGE NAME (what `turbo prune` accepts) and
  # `APP_SRC_DIR` is the DIRECTORY (what the runner stage WORKDIRs into). For
  # `@deployer/svc-health` they differ — deriving one from the other produces
  # `/app/apps/@deployer/svc-health`, a directory that never exists.

  build-svc-bff:
    profiles: ["all", "services", "web"]
    build:
      context: ../../..
      dockerfile: ./infra/docker/builder/app/Dockerfile.app.dev
      args:
        - APP=@deployer/bff
        - APP_SRC_DIR=api/bff
        - APP_DEPS_MODE=baked
        # Deployment target: omit devDependencies. Every app starts with
        # `bun --bun src/main.ts`, and bun transpiles TS itself — so the
        # toolchain is build-time only. Measured: 1082 MB -> ~200 MB of
        # node_modules for a bare service image.
        - APP_INSTALL_PRODUCTION=1
        - BUILDKIT_INLINE_CACHE=1
    image: ${DEPLOYER_BFF_IMAGE:-deployer-svc-bff:dev}
    <<: *no-pull
    command: ["echo", "bff image built: ${DEPLOYER_BFF_IMAGE:-deployer-svc-bff:dev}"]
    restart: "no"

  build-svc-health:
    profiles: ["all", "services", "web"]
    build:
      context: ../../..
      dockerfile: ./infra/docker/builder/app/Dockerfile.app.dev
      args:
        - APP=@deployer/svc-health
        - APP_SRC_DIR=api/services/health
        - APP_DEPS_MODE=baked
        # Deployment target: omit devDependencies. Every app starts with
        # `bun --bun src/main.ts`, and bun transpiles TS itself — so the
        # toolchain is build-time only. Measured: 1082 MB -> ~200 MB of
        # node_modules for a bare service image.
        - APP_INSTALL_PRODUCTION=1
        - BUILDKIT_INLINE_CACHE=1
    image: ${DEPLOYER_SVC_HEALTH_IMAGE:-deployer-svc-health:dev}
    <<: *no-pull
    command: ["echo", "health image built: ${DEPLOYER_SVC_HEALTH_IMAGE:-deployer-svc-health:dev}"]
    restart: "no"

  build-svc-identity:
    profiles: ["all", "services", "web"]
    build:
      context: ../../..
      dockerfile: ./infra/docker/builder/app/Dockerfile.app.dev
      args:
        - APP=@deployer/svc-identity
        - APP_SRC_DIR=api/services/identity
        - APP_DEPS_MODE=baked
        # Deployment target: omit devDependencies. Every app starts with
        # `bun --bun src/main.ts`, and bun transpiles TS itself — so the
        # toolchain is build-time only. Measured: 1082 MB -> ~200 MB of
        # node_modules for a bare service image.
        - APP_INSTALL_PRODUCTION=1
        - BUILDKIT_INLINE_CACHE=1
    image: ${DEPLOYER_SVC_IDENTITY_IMAGE:-deployer-svc-identity:dev}
    <<: *no-pull
    command: ["echo", "identity image built: ${DEPLOYER_SVC_IDENTITY_IMAGE:-deployer-svc-identity:dev}"]
    restart: "no"

  build-svc-project:
    profiles: ["all", "services", "web"]
    build:
      context: ../../..
      dockerfile: ./infra/docker/builder/app/Dockerfile.app.dev
      args:
        - APP=@deployer/svc-project
        - APP_SRC_DIR=api/services/project
        - APP_DEPS_MODE=baked
        # Deployment target: omit devDependencies. Every app starts with
        # `bun --bun src/main.ts`, and bun transpiles TS itself — so the
        # toolchain is build-time only. Measured: 1082 MB -> ~200 MB of
        # node_modules for a bare service image.
        - APP_INSTALL_PRODUCTION=1
        - BUILDKIT_INLINE_CACHE=1
    image: ${DEPLOYER_SVC_PROJECT_IMAGE:-deployer-svc-project:dev}
    <<: *no-pull
    command: ["echo", "project image built: ${DEPLOYER_SVC_PROJECT_IMAGE:-deployer-svc-project:dev}"]
    restart: "no"

  build-svc-fleet:
    profiles: ["all", "services", "web"]
    build:
      context: ../../..
      dockerfile: ./infra/docker/builder/app/Dockerfile.app.dev
      args:
        - APP=@deployer/svc-fleet
        - APP_SRC_DIR=api/services/fleet
        - APP_DEPS_MODE=baked
        # Deployment target: omit devDependencies. Every app starts with
        # `bun --bun src/main.ts`, and bun transpiles TS itself — so the
        # toolchain is build-time only. Measured: 1082 MB -> ~200 MB of
        # node_modules for a bare service image.
        - APP_INSTALL_PRODUCTION=1
        - BUILDKIT_INLINE_CACHE=1
    image: ${DEPLOYER_SVC_FLEET_IMAGE:-deployer-svc-fleet:dev}
    <<: *no-pull
    command: ["echo", "fleet image built: ${DEPLOYER_SVC_FLEET_IMAGE:-deployer-svc-fleet:dev}"]
    restart: "no"

  build-svc-runtime:
    profiles: ["all", "services", "web"]
    build:
      context: ../../..
      dockerfile: ./infra/docker/builder/app/Dockerfile.app.dev
      args:
        - APP=@deployer/svc-runtime
        - APP_SRC_DIR=api/services/runtime
        - APP_DEPS_MODE=baked
        # Deployment target: omit devDependencies. Every app starts with
        # `bun --bun src/main.ts`, and bun transpiles TS itself — so the
        # toolchain is build-time only. Measured: 1082 MB -> ~200 MB of
        # node_modules for a bare service image.
        - APP_INSTALL_PRODUCTION=1
        - BUILDKIT_INLINE_CACHE=1
    image: ${DEPLOYER_SVC_RUNTIME_IMAGE:-deployer-svc-runtime:dev}
    <<: *no-pull
    command: ["echo", "runtime image built: ${DEPLOYER_SVC_RUNTIME_IMAGE:-deployer-svc-runtime:dev}"]
    restart: "no"

  # The per-node mesh agent. NOT a compose service at RUNTIME: setup starts it as a
  # plain host-network container (`deployer-mesh-agent`), because it must exist
  # before the swarm does. Compose only makes the TAG exist.
  #
  # Its own Dockerfile (a compiled binary on Alpine), not `Dockerfile.app.dev`: it
  # holds the node's private keys with NET_ADMIN, so it ships no toolchain.
  #
  # `entrypoint`, not `command`, is overridden: the image's ENTRYPOINT is the agent
  # binary, so a `command:` would only become its ARGUMENTS and this producer would
  # start an agent (with no NET_ADMIN) that never exits.
  build-mesh-agent:
    profiles: ["all", "services", "web"]
    build:
      context: ../../..
      dockerfile: ./infra/docker/builder/mesh-agent/Dockerfile.mesh-agent
      secrets:
        - turbo_token
        - turbo_team
        - turbo_api
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: ${MESH_AGENT_IMAGE:-deployer-mesh-agent:dev}
    <<: *no-pull
    entrypoint: ["echo", "mesh agent image built: ${MESH_AGENT_IMAGE:-deployer-mesh-agent:dev}"]
    restart: "no"

  # The web app's IMAGE. Compose also RUNS it here (unlike the API tier), because
  # the dashboard is a front-end rather than cluster infrastructure — see
  # `MANAGED_WEB_APP_EXTERNAL: "true"` above. `--profile web` selects it.
  build-web:
    profiles: ["all", "web"]
    build:
      context: ../../..
      dockerfile: ./infra/docker/builder/app/Dockerfile.app.dev
      args:
        - APP=@deployer/web
        # ── `APP_SRC_DIR` IS NOT OPTIONAL, EVEN WHEN IT LOOKS DERIVABLE ─────
        # The Dockerfile WORKDIRs into `/app/apps/${APP_SRC_DIR}`. Omit it and
        # the WORKDIR becomes `/app/apps` — a directory that exists, so nothing
        # fails at build time. The damage only shows at RUNTIME: `bun run dev`
        # then walks UP to the monorepo ROOT package.json and runs
        #
        #   $ dotenv -e .env -e .env.local -- bun scripts/compose.ts --file docker-compose.services.dev.yml
        #   error: Module not found "scripts/compose.ts"
        #   error: script "dev" exited with code 1   (deployer-managed-web 0/1, forever)
        #
        # `scripts/compose.ts` is not in a pruned image, and the exit code named a
        # missing MODULE rather than a missing WORKDIR — so the crash read as a
        # broken script instead of a one-argument omission.
        - APP_SRC_DIR=web
        - APP_DEPS_MODE=baked
        # ── THE WEB APP CANNOT DROP ITS devDependencies EITHER ─────────────
        # Same reason as setup: this image's CMD is `bun run dev`, which runs
        # `scripts/entrypoint.dev.ts` and starts the Next.js SERVER plus its
        # compiler. `next` and the toolchain are RUNTIME dependencies here, not
        # build-time ones — unlike the six `svc-*` images, which start with
        # `bun --bun src/main.ts` and need nothing else.
        #
        # The measured 1082 MB -> 507 MB saving belongs to those services. Applying
        # it here deleted `next`, and the container could not boot.
        - APP_INSTALL_PRODUCTION=0
        - BUILDKIT_INLINE_CACHE=1
    image: ${MANAGED_WEB_APP_IMAGE:-deployer-web:dev}
    <<: *no-pull
    command: ["echo", "web image built: ${MANAGED_WEB_APP_IMAGE:-deployer-web:dev}"]
    restart: "no"

networks:
  app_network_dev:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_app_network_dev
    driver: bridge
  deployer_platform:
    name: deployer-platform
    driver: bridge

volumes:
  # The node's local SQLite (ONE `node_config` row per node). Profile-specific —
  # see the `NODE_LOCAL_DB_VOLUME` note on `setup-dev` for why sharing it with the
  # compose-owned profile injects a foreign `database_url`.
  supervised_local_db:
    name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}_supervised_local_db
  deployer-traefik-config:
    name: ${TRAEFIK_CONFIG_VOLUME:-deployer-traefik-config}
  # The mesh agent's control-socket volume (`/run/deployer-mesh/agent.sock`).
  # NAMED LITERALLY, never project-prefixed: the agent container and every tier
  # service setup schedules mount it by this exact name.
  deployer-mesh-run:
    name: deployer-mesh-run

# Turbo remote-cache credentials, read from the project environment (`.env`).
# Consumed by `RUN --mount=type=secret` in the Dockerfiles, so they never land
# in an image layer or in `docker history`. Unset/empty = local cache only.
secrets:
  turbo_token:
    environment: TURBO_TOKEN
  turbo_team:
    environment: TURBO_TEAM
  turbo_api:
    environment: TURBO_API
