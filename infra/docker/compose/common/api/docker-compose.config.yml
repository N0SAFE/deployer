# =====================================================================
# Api BASE config — INCLUDE-ONLY. This is the REAL base: everything the
# api needs regardless of variant (env defaults, volumes, dns). Variant
# configs (docker-compose.config.{dev,prod}.yml) extend THIS; the
# orchestrators extend the variant and add only per-project wiring
# (container_name, networks, depends_on, MANAGED_* flags).
# =====================================================================
services:
  api:
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      AUTH_SECRET: ${AUTH_SECRET:-fallback-auth-secret}
      BETTER_AUTH_SECRET: ${AUTH_SECRET:-fallback-auth-secret}
      AUTH_BASE_DOMAIN: ${AUTH_BASE_DOMAIN:-.deployer.localhost}
      DEV_AUTH_KEY: ${DEV_AUTH_KEY:-dev-fallback-key}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      PASSKEY_RPID: ${PASSKEY_RPID:-localhost}
      PASSKEY_RPNAME: ${PASSKEY_RPNAME:-NestJS App}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:-http://localhost:3000}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@admin.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-adminadmin}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/apps/api/uploads}
      ADMIN_BOOTSTRAP: ${ADMIN_BOOTSTRAP:-auto}
      ENABLE_SEEDING: ${ENABLE_SEEDING:-false}
      ENABLE_DEV_BOOTSTRAP: ${ENABLE_DEV_BOOTSTRAP:-true}
      TRAEFIK_CONFIG_VOLUME: ${TRAEFIK_CONFIG_VOLUME:-deployer-traefik-config}
      DEPLOYER_PREFIX: ${DEPLOYER_PREFIX:-}
      DEPLOYER_TRAEFIK_IMAGE: ${DEPLOYER_TRAEFIK_IMAGE:-traefik:v3.6.10}
      DEPLOYER_TRAEFIK_HTTP_PORT: ${DEPLOYER_TRAEFIK_HTTP_PORT:-80}
      DEPLOYER_REDIS_URL: ${DEPLOYER_REDIS_URL:-redis://redis:6379}
      # The mesh agent image the API ensures on its own node. MUST match the tag
      # setup started the agent from: on a mismatch the API replaces the running
      # agent with this one.
      MESH_AGENT_IMAGE: ${MESH_AGENT_IMAGE:-deployer-mesh-agent:latest}
      # Whether the per-node agent brings up a REAL WireGuard interface.
      #
      #   observe  default in dev — plan, gossip and converge doors, but never
      #            touch the kernel. The dev stack stops creating a host-level
      #            `deployer-mesh` interface every time it starts.
      #   kernel   what production runs, and what a real cluster needs: Swarm
      #            advertises the mesh address the interface carries.
      #
      # Set `kernel` here (or in .env) to exercise the real dataplane locally.
      MESH_AGENT_DATAPLANE: ${MESH_AGENT_DATAPLANE:-kernel}
      TURBO_TOKEN: ${TURBO_TOKEN:-}
      TURBO_TEAM: ${TURBO_TEAM:-}
    volumes:
      # Docker daemon socket for dockerode-backed runtime operations.
      - /var/run/docker.sock:/var/run/docker.sock
      # Platform config SHARING volume (API writes; Traefik mounts ro).
      - ${TRAEFIK_CONFIG_VOLUME:-deployer-traefik-config}:/app/traefik-configs
      # The mesh agent's control socket (`/run/deployer-mesh/agent.sock`). Only
      # needed when the API runs as a COMPOSE container; the swarm service setup
      # schedules mounts it itself. The orchestrator MUST declare it as
      # `deployer-mesh-run: { name: deployer-mesh-run }` (literal, unprefixed).
      - deployer-mesh-run:/run/deployer-mesh