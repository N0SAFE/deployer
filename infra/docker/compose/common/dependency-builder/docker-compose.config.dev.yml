# =====================================================================
# dependency-builder DEV config — INCLUDE-ONLY.
#
# One container publishes every internal workspace package the enabled
# applications need, then keeps them current while the stack runs. The
# applications consume the artifacts through the shared `dep-output` volume
# instead of building their own.
#
# ── WHERE THE BUILD ACTUALLY HAPPENS ─────────────────────────────────────
#
# At IMAGE BUILD time, not at container start. The Dockerfile runs a full
# `turbo run build` over every internal package and keeps Turbo's cache in the
# image, so the artifacts exist before anything is started.
#
# At container start this process PUBLISHES them: it adopts the image's `dist/`
# trees into the volume, symlinks each package's `dist/` at the volume, and opens
# the gate. Its own build is skipped because there is nothing left to build —
# which is what removes the "run, then rerun" a runtime-only build would cause.
#
# ── Why this REPLACES the per-app `turbo run build` step ────────────────
#
# Every other dev image used to build its own copy of its packages'
# `dist/` inside the image, so N applications meant N builds of a shared
# package and N copies that could drift. Here the build happens once and is
# published to one volume that every application reads.
# =====================================================================
services:
  dependency-builder:
    build:
      context: ../../../../..
      dockerfile: ./infra/docker/builder/dependency-builder/Dockerfile.dependency-builder.dev
      tags:
        - "${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-dependency-builder-dev:latest"
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: ${COMPOSE_PROJECT_NAME:-nextjs-nestjs}-dependency-builder-dev
    # The tool resolves `tsconfig.json` from `$cwd`, and the decorator flags
    # nest-commander needs are read from there.
    working_dir: /app/tooling/dependency-builder
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      # ── THE ENABLEMENT SIGNAL ────────────────────────────────────────────
      # Which applications this run has enabled. The tool reads it to compute
      # the package union, so the union and the running containers cannot
      # drift.
      #
      # It is passed EXPLICITLY rather than left to compose. `COMPOSE_PROFILES`
      # is the variable that selects profiles, but compose does NOT forward it
      # into the containers it starts (measured: the host value is absent from
      # the container's environment), so a service cannot read back the very
      # variable that selected it. Interpolating it here is what carries the
      # value across that boundary.
      #
      # Defaults to `all`, matching the root `dev` script and `.env.example`.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-all}
      # Keeps the package builds from dereferencing the `dist/` symlink that
      # publishes artifacts to this volume. See the note in the image.
      PKG_BUILD_KEEP_DIST: "1"
    # No `DEP_BUILDER_APPS`: the enabled set is DETECTED from COMPOSE_PROFILES,
    # not passed as flags. A second list here is how the union and the running
    # services drift apart — a service removed from a compose file would stay
    # in the union, and one added would be silently missing from it.
    command:
      - sh
      - -c
      - >-
        bun --bun src/main.ts build --root /app
    volumes:
      # The shared output. This container is its only writer; the applications
      # mount it read-only.
      #
      # ── INSIDE /app, NOT A SIBLING ────────────────────────────────────────
      # Turbo refuses to cache a task whose `outputs` resolve outside the
      # workspace root, and the packages' `dist/` symlinks point here. At the
      # old `/dep-output` every task warned `tar attempts to write outside of
      # directory` and NO cache entry was written (measured: 2 entries for 38
      # packages), so every boot rebuilt everything. Under `/app` there are zero
      # warnings and the second run reports FULL TURBO.
      #
      # The applications mount this at the same path, which also keeps their own
      # `dist/` symlinks inside their `/app` — Turbopack has the same
      # boundary rule as Turbo.
      - dep_output_dev:/app/dep-output
    develop:
      watch:
        # ── Sources ──────────────────────────────────────────────────────────
        # One rule for the whole repository, not a list of packages. Adding a
        # package therefore needs no edit here.
        #
        # A SYNC, not a bind mount: inotify does not deliver events across a
        # bind mount for writes made on the host side, so Turbo's watcher would
        # never see the edit and never rebuild. A synced file is a real
        # in-container write. (Measured in tmp/watch-lab; see FINDINGS.md #5.)
        #
        # `initial_sync` populates the container from the host on startup.
        - action: sync
          initial_sync: true
          path: ../../../../..
          target: /app
          ignore:
            - node_modules/
            - "**/node_modules/"
            - bun.lock*
            - package-lock.json
            - yarn.lock
            - pnpm-lock.yaml
            - "**/dist/"
            - "**/build/"
            - "**/.next/"
            - "**/out/"
            - "**/.output/"
            - "**/.turbo/"
            - "**/.cache/"
            - "**/.vite/"
            - "**/*.log"
            - .git/
            - .gitignore
            - docker/
            - Dockerfile*
            - docker-compose*.yml
            - .dockerignore
            - "**/.vscode/"
            - "**/.idea/"
            - "**/*.swp"
            - "**/*.swo"
            - "**/coverage/"
            - "**/.nyc_output/"
            - "**/.DS_Store"
            - "**/Thumbs.db"
        # ── Recreate when a build input changes ─────────────────────────────
        # A lockfile or manifest change means the installed dependency tree is
        # stale, which a file sync cannot fix — the container has to be
        # recreated so the image's install runs again.
        - action: rebuild
          path: ../../../../..
          include:
            - package.json
            - bun.lock*
            - turbo.json
            - tooling/dependency-builder/package.json
            - tooling/dependency-builder/tsconfig.json
            - infra/docker/builder/dependency-builder/Dockerfile.dependency-builder.dev
            - infra/docker/compose/common/dependency-builder/**
    healthcheck:
      # The stamp is written only after a successful initial build, so a
      # healthy builder means "the shared volume holds real artifacts" — which
      # is what lets the applications start without racing it.
      #
      # The path is absolute and does not depend on this container's working
      # directory.
      test: ["CMD-SHELL", "test -f /app/dep-output/.initial-build-complete"]
      interval: 2s
      timeout: 3s
      retries: 3
      # Generous: the first build walks the whole union on a cold cache.
      # Not `service_healthy` gating on the applications, so that value is the
      # only thing standing between a cold start and a false failure.
      start_period: 600s
    restart: unless-stopped
