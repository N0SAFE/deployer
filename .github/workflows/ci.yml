name: CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        # Run tests on all PRs regardless of target branch
        branches: ["**"]

env:
    BUN_VERSION: "1.3.3"
    NODE_VERSION: "22"
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
    # Job 0: Setup - Install dependencies and prepare environment
    setup:
        name: 🔧 Setup & Install Dependencies
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: 📚 Checkout repository
              uses: actions/checkout@v4

            - name: 🐰 Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: 📦 Install dependencies
              run: |
                bun install --frozen-lockfile

            - name: 💾 Share dependencies for this CI run
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                      apps/**/node_modules
                      packages/**/node_modules
                      apps/doc/.source
                  key: bun-deps-${{ github.run_id }}-${{ runner.os }}

    # Job 1: Generate Declarative Routes
    generate-declarative-routes:
        name: 📝 Generate Declarative Routes
        runs-on: ubuntu-latest
        timeout-minutes: 8
        needs: setup
        outputs:
            cache-hit: ${{ steps.cache-declarative-routes.outputs.cache-hit }}
        steps:
            - name: 📚 Checkout repository
              uses: actions/checkout@v4

            - name: 💾 Cache declarative routes
              id: cache-declarative-routes
              uses: actions/cache@v4
              with:
                  path: |
                      apps/web/src/routes/index.ts
                      apps/web/src/routes/openapi.ts
                      apps/web/openapi-docs.yml
                      apps/web/redoc-static.html
                  key: declarative-routes-${{ runner.os }}-${{ hashFiles('apps/web/src/**/page.tsx', 'apps/web/src/**/route.info.ts') }}
                  restore-keys: |
                      declarative-routes-${{ runner.os }}-

            - name: 🐰 Setup Bun
              if: steps.cache-declarative-routes.outputs.cache-hit != 'true'
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: 💾 Restore shared dependencies
              id: restore-shared-deps
              if: steps.cache-declarative-routes.outputs.cache-hit != 'true'
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                      apps/**/node_modules
                      packages/**/node_modules
                      apps/doc/.source
                  key: bun-deps-${{ github.run_id }}-${{ runner.os }}

            - name: 📦 Install dependencies (fallback)
              if: steps.cache-declarative-routes.outputs.cache-hit != 'true' && steps.restore-shared-deps.outputs.cache-hit != 'true'
              run: |
                bun install --frozen-lockfile

            - name: 🛤️ Generate declarative routes
              if: steps.cache-declarative-routes.outputs.cache-hit != 'true'
              run: |
                bun --bun run @repo/cli-declarative-routing build
                bun --bun run web dr:build

            - name: 📝 Generate OpenAPI documentation
              if: steps.cache-declarative-routes.outputs.cache-hit != 'true'
              run: |
                  cd apps/web
                  bun --bun run openapi:yaml
                  bun --bun run openapi:html

    # Job 2: Lint and Type Check
    lint-and-typecheck:
        name: 🔍 Lint & Type Check
        runs-on: ubuntu-latest
        timeout-minutes: 8
        needs: [setup, generate-declarative-routes]
        env:
            # Turborepo configuration for --affected flag
            # Use PR target branch for pull requests, main for pushes
            TURBO_SCM_BASE: origin/${{ github.base_ref || 'main' }}
            
            # Essential environment variables for linting/type checking
            API_URL: http://localhost:8055/
            API_PORT: 8055
            API_PING_PATH: /server/health
            API_ADMIN_TOKEN: ci-test-admin-token
            NEXT_PUBLIC_APP_URL: http://localhost:3003/
            NEXT_PUBLIC_APP_PORT: 3003
            AUTH_SECRET: ci-test-auth-secret
            DIRECTUS_SECRET: ci-test-directus-secret
            DIRECTUS_ADMIN_EMAIL: ci-admin@test.com
            DIRECTUS_ADMIN_PASSWORD: ci-test-password
            NEXT_TELEMETRY_DISABLED: 1
            NODE_ENV: test
            MILLION_LINT: false
            REACT_SCAN: false
            SHOW_AUTH_LOGS: false
            NEXT_PUBLIC_SHOW_AUTH_LOGS: false

        steps:
            - name: 📚 Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0  # Fetch all history for all branches and tags

            - name: 🔍 Fetch base branch for comparison
              run: |
                  BASE_BRANCH="${{ github.base_ref || 'main' }}"
                  CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
                  
                  # Only fetch if we're not already on the base branch
                  if [ "$CURRENT_BRANCH" != "$BASE_BRANCH" ]; then
                    echo "Fetching ${BASE_BRANCH} for comparison (current: ${CURRENT_BRANCH})"
                    git fetch origin "${BASE_BRANCH}:${BASE_BRANCH}"
                  else
                    echo "Already on ${BASE_BRANCH}, skipping fetch"
                  fi

            - name: 🐰 Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: 💾 Restore shared dependencies
              id: restore-shared-deps
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                      apps/**/node_modules
                      packages/**/node_modules
                      apps/doc/.source
                  key: bun-deps-${{ github.run_id }}-${{ runner.os }}

            - name: 📦 Install dependencies (fallback)
              if: steps.restore-shared-deps.outputs.cache-hit != 'true'
              run: |
                bun install --frozen-lockfile

            - name: � Restore declarative routes cache
              uses: actions/cache@v4
              with:
                  path: |
                      apps/web/src/routes/index.ts
                      apps/web/src/routes/openapi.ts
                      apps/web/openapi-docs.yml
                      apps/web/redoc-static.html
                  key: declarative-routes-${{ runner.os }}-${{ hashFiles('apps/web/src/**/page.tsx', 'apps/web/src/**/route.info.ts') }}
                  restore-keys: |
                      declarative-routes-${{ runner.os }}-

            - name: �🔍 Run ESLint
              run: bun x turbo run lint --affected --concurrency=75%

            - name: 🔎 Run TypeScript type-check
              # `--continue` is required: turbo otherwise stops at the first
              # failing package, so CI would report one error and hide the rest.
              run: bun x turbo run type-check --affected --continue --concurrency=75%

            - name: 🧭 DI graph acyclicity check
              # Static parse of every *.module.ts — no Docker daemon, no DB needed.
              # DI_GATE=cycles gates on the DI-nesting acyclicity property alone.
              # Drop DI_GATE (default `all`) once the SC7/SC8 advisories are resolved.
              env:
                  DI_GATE: cycles
              run: bun --bun run check:di-graph

    # Job 3: Build
    build:
        name: 🏗️ Build
        runs-on: ubuntu-latest
        timeout-minutes: 12
        needs: [generate-declarative-routes]
        env:
            # Turborepo configuration for --affected flag
            # Use PR target branch for pull requests, main for pushes
            TURBO_SCM_BASE: origin/${{ github.base_ref || 'main' }}
            
            # API Configuration
            API_URL: http://localhost:8055/
            API_PORT: 8055
            API_PING_PATH: /server/health
            API_ADMIN_TOKEN: ci-test-admin-token

            # App Configuration
            NEXT_PUBLIC_APP_URL: http://localhost:3003/
            NEXT_PUBLIC_APP_PORT: 3003

            # Database Configuration (for testing)
            DB_DATABASE: directus_test
            DB_ROOT_PASSWORD: test-password

            # Authentication
            AUTH_SECRET: ci-test-auth-secret-QgafJQw3O-k1gambz7YGKjtj5ZZe0dnL-WlSw4PtMDc

            # Directus Configuration
            DIRECTUS_SECRET: ci-test-directus-secret-value
            DIRECTUS_ADMIN_EMAIL: ci-admin@test.com
            DIRECTUS_ADMIN_PASSWORD: ci-test-password

            # Next.js Configuration
            NEXT_TELEMETRY_DISABLED: 1
            NODE_ENV: test

            # Development tools (disabled for CI)
            MILLION_LINT: false
            REACT_SCAN: false
            SHOW_AUTH_LOGS: false
            NEXT_PUBLIC_SHOW_AUTH_LOGS: false
            
            # Build optimization
            SKIP_STATIC_GENERATION: true

        steps:
            - name: 📚 Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0  # Fetch all history for all branches and tags

            - name: 🔍 Fetch base branch for comparison
              run: |
                  BASE_BRANCH="${{ github.base_ref || 'main' }}"
                  CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
                  
                  # Only fetch if we're not already on the base branch
                  if [ "$CURRENT_BRANCH" != "$BASE_BRANCH" ]; then
                    echo "Fetching ${BASE_BRANCH} for comparison (current: ${CURRENT_BRANCH})"
                    git fetch origin "${BASE_BRANCH}:${BASE_BRANCH}"
                  else
                    echo "Already on ${BASE_BRANCH}, skipping fetch"
                  fi

            - name: 🐰 Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: 💾 Restore shared dependencies
              id: restore-shared-deps
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                      apps/**/node_modules
                      packages/**/node_modules
                      apps/doc/.source
                  key: bun-deps-${{ github.run_id }}-${{ runner.os }}

            - name: 📦 Install dependencies (fallback)
              if: steps.restore-shared-deps.outputs.cache-hit != 'true'
              run: |
                bun install --frozen-lockfile

            - name: 💾 Restore declarative routes cache
              uses: actions/cache@v4
              with:
                  path: |
                      apps/web/src/routes/index.ts
                      apps/web/src/routes/openapi.ts
                      apps/web/openapi-docs.yml
                      apps/web/redoc-static.html
                  key: declarative-routes-${{ runner.os }}-${{ hashFiles('apps/web/src/**/page.tsx', 'apps/web/src/**/route.info.ts') }}
                  restore-keys: |
                      declarative-routes-${{ runner.os }}-

            - name: 🏗️ Build packages
              run: |
                  # Build shared packages first
                  bun x turbo run compile --affected --concurrency=75%

    # Job 4: Test
    test:
        name: 🧪 Test
        runs-on: ubuntu-latest
        timeout-minutes: 12
        needs: [generate-declarative-routes]
        env:
            # Turborepo configuration for --affected flag
            # Use PR target branch for pull requests, main for pushes
            TURBO_SCM_BASE: origin/${{ github.base_ref || 'main' }}
            
            # API Configuration
            API_URL: http://localhost:8055/
            API_PORT: 8055
            API_PING_PATH: /server/health
            API_ADMIN_TOKEN: ci-test-admin-token

            # App Configuration
            NEXT_PUBLIC_APP_URL: http://localhost:3003/
            NEXT_PUBLIC_APP_PORT: 3003

            # Database Configuration (for testing)
            DB_DATABASE: directus_test
            DB_ROOT_PASSWORD: test-password

            # Authentication
            AUTH_SECRET: ci-test-auth-secret-QgafJQw3O-k1gambz7YGKjtj5ZZe0dnL-WlSw4PtMDc

            # Directus Configuration
            DIRECTUS_SECRET: ci-test-directus-secret-value
            DIRECTUS_ADMIN_EMAIL: ci-admin@test.com
            DIRECTUS_ADMIN_PASSWORD: ci-test-password

            # Next.js Configuration
            NEXT_TELEMETRY_DISABLED: 1
            NODE_ENV: test

            # Development tools (disabled for CI)
            MILLION_LINT: false
            REACT_SCAN: false
            SHOW_AUTH_LOGS: false
            NEXT_PUBLIC_SHOW_AUTH_LOGS: false
            
            # Build optimization
            SKIP_STATIC_GENERATION: true

        steps:
            - name: 📚 Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0  # Fetch all history for all branches and tags

            - name: 🔍 Fetch base branch for comparison
              run: |
                  BASE_BRANCH="${{ github.base_ref || 'main' }}"
                  CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
                  
                  # Only fetch if we're not already on the base branch
                  if [ "$CURRENT_BRANCH" != "$BASE_BRANCH" ]; then
                    echo "Fetching ${BASE_BRANCH} for comparison (current: ${CURRENT_BRANCH})"
                    git fetch origin "${BASE_BRANCH}:${BASE_BRANCH}"
                  else
                    echo "Already on ${BASE_BRANCH}, skipping fetch"
                  fi

            - name: 🐰 Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: 💾 Restore shared dependencies
              id: restore-shared-deps
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                      apps/**/node_modules
                      packages/**/node_modules
                      apps/doc/.source
                  key: bun-deps-${{ github.run_id }}-${{ runner.os }}

            - name: 📦 Install dependencies (fallback)
              if: steps.restore-shared-deps.outputs.cache-hit != 'true'
              run: |
                bun install --frozen-lockfile

            - name: 💾 Restore declarative routes cache
              uses: actions/cache@v4
              with:
                  path: |
                      apps/web/src/routes/index.ts
                      apps/web/src/routes/openapi.ts
                      apps/web/openapi-docs.yml
                      apps/web/redoc-static.html
                  key: declarative-routes-${{ runner.os }}-${{ hashFiles('apps/web/src/**/page.tsx', 'apps/web/src/**/route.info.ts') }}
                  restore-keys: |
                      declarative-routes-${{ runner.os }}-

            - name: 🧪 Run tests for all packages
              run: bun x turbo run test --affected --concurrency=75%

    # Job 4b: End-to-end tests
    #
    # Its own job because it needs Docker — the web harness starts an
    # `oven/bun` container serving the production build, and the API harness
    # starts a Postgres testcontainer. It also must not mask unit-test results.
    #
    # STAGED — deliberately not blocking yet. The API e2e suite carries 71
    # pre-existing failures (18 of 32 files) that were invisible until now
    # because CI never ran e2e at all. Landing this as blocking would leave
    # `main` permanently red, which trains people to ignore CI. It reports
    # first; flip to blocking when the Phase 3 test-debt work lands
    # (docs/implementation-plan-200.md, phase 3).
    e2e:
        name: 🎭 End-to-end Tests
        runs-on: ubuntu-latest
        timeout-minutes: 40
        needs: [generate-declarative-routes]
        continue-on-error: true
        env:
            TURBO_SCM_BASE: origin/${{ github.base_ref || 'main' }}
            NODE_ENV: test
            NEXT_TELEMETRY_DISABLED: 1
            AUTH_SECRET: ci-test-auth-secret-QgafJQw3O-k1gambz7YGKjtj5ZZe0dnLWlSw4PtMDc
            BETTER_AUTH_SECRET: ci-test-auth-secret-QgafJQw3O-k1gambz7YGKjtj5ZZe0dnLWlSw4PtMDc
        steps:
            - name: 📚 Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 🐰 Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: 💾 Restore shared dependencies
              id: restore-shared-deps
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                      apps/**/node_modules
                      packages/**/node_modules
                      apps/doc/.source
                  key: bun-deps-${{ github.run_id }}-${{ runner.os }}

            - name: 📦 Install dependencies (fallback)
              if: steps.restore-shared-deps.outputs.cache-hit != 'true'
              run: bun install --frozen-lockfile

            - name: 🏗️ Build (the web e2e harness serves the production build)
              run: bun x turbo run build --affected --concurrency=75%

            - name: 🎭 Run end-to-end tests
              run: bun x turbo run test:e2e --affected --concurrency=50%

    # Job 5: Deployment Ready Check
    deployment-ready:
        name: 🚀 Deployment Ready
        runs-on: ubuntu-latest
        timeout-minutes: 3
        needs: [setup, generate-declarative-routes, lint-and-typecheck, build, test]
        if: always()

        steps:
            - name: ✅ Check deployment readiness
              run: |
                  echo "🔍 Checking CI/CD pipeline results..."

                  SETUP_STATUS="${{ needs.setup.result }}"
                  LINT_STATUS="${{ needs.lint-and-typecheck.result }}"
                  BUILD_STATUS="${{ needs.build.result }}"
                  TEST_STATUS="${{ needs.test.result }}"
                  DR_STATUS="${{ needs.generate-declarative-routes.result }}"

                  DR_CACHE_HIT="${{ needs.generate-declarative-routes.outputs.cache-hit }}"

                  echo "📋 Pipeline Results:"
                  echo "  - Setup & Dependencies: $SETUP_STATUS"
                  echo "  - Lint & Type Check: $LINT_STATUS"
                  echo "  - Build: $BUILD_STATUS"
                  echo "  - Test: $TEST_STATUS"
                  echo "  - Declarative Routes: $DR_STATUS"
                  
                  echo ""
                  echo "🎯 Cache Performance:"
                  echo "  - Declarative Routes: $([ "$DR_CACHE_HIT" = "true" ] && echo "✅ Cache HIT" || echo "❌ Cache MISS")"

                  if [ "$SETUP_STATUS" = "success" ] && [ "$LINT_STATUS" = "success" ] && [ "$BUILD_STATUS" = "success" ] && [ "$TEST_STATUS" = "success" ] && [ "$DR_STATUS" = "success" ]; then
                    if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                      echo "🚀 ✅ Ready for production deployment!"
                      echo "deployment_ready=true" >> $GITHUB_OUTPUT
                    else
                      echo "🚀 ✅ Ready for staging deployment!"
                      echo "deployment_ready=true" >> $GITHUB_OUTPUT
                    fi
                  else
                    echo "🚀 ❌ Not ready for deployment"
                    echo "deployment_ready=false" >> $GITHUB_OUTPUT
                    exit 1
                  fi

            - name: 📋 Generate deployment summary
              run: |
                  DR_CACHE_HIT="${{ needs.generate-declarative-routes.outputs.cache-hit }}"
                  
                  echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
                  echo "| Setup & Dependencies | ${{ needs.setup.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Lint & Type Check | ${{ needs.lint-and-typecheck.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Build | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Test | ${{ needs.test.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| Declarative Routes | ${{ needs.generate-declarative-routes.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  
                  echo "### 🎯 Cache Performance" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Cache Type | Status |" >> $GITHUB_STEP_SUMMARY
                  echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
                  echo "| Declarative Routes | $([ "$DR_CACHE_HIT" = "true" ] && echo "✅ HIT" || echo "❌ MISS") |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                    echo "🎯 **Branch**: Production (main)" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "🎯 **Branch**: Development" >> $GITHUB_STEP_SUMMARY
                  fi
