# Deploy Pipeline - Build & Push the API tier images
#
# Builds the six production tier images (BFF + five services) from
# infra/docker/builder/api/Dockerfile.api.prod and pushes them to GitHub
# Container Registry. `apps/setup` schedules them on the swarm from the
# DEPLOYER_BFF_IMAGE / DEPLOYER_SVC_*_IMAGE tags.
#
# Triggers:
#   - Push of a version tag (v*)
#   - Manual trigger via workflow_dispatch
#
# Image tagging scheme (one repository per tier app):
#   ghcr.io/<owner>/<repo>/<app>:latest      — latest build
#   ghcr.io/<owner>/<repo>/<app>:<version>   — semantic version (e.g., 1.2.3)
#   ghcr.io/<owner>/<repo>/<app>:<sha>       — git commit SHA
# where <app> is one of svc-bff, svc-health, svc-identity, svc-project,
# svc-fleet, svc-runtime.

name: Deploy

on:
  push:
    tags:
      - "v*"  # Trigger on version tags (v1.0.0, v2.3.4-alpha, etc.)
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (defaults to git SHA)"
        required: false
        default: ""

env:
  # GitHub Container Registry settings
  REGISTRY: ghcr.io
  # Bun version must match the Dockerfile base image
  BUN_VERSION: "1.4.3"

jobs:
  # ── Job 1: Extract version from package.json ──────────────────────────────
  version:
    name: 📦 Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      is_release: ${{ steps.extract-version.outputs.is_release }}
      git_sha: ${{ github.sha }}
    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Extract version from the BFF package.json
        id: extract-version
        run: |
          # The BFF is the platform's public API surface and carries its release version
          VERSION=$(jq -r '.version' apps/api-services/bff/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Determine if this is a release (tag matches version)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${{ github.ref_name }}"
            TAG_VERSION="${TAG_VERSION#v}"  # Remove v prefix
            if [ "$TAG_VERSION" = "$VERSION" ]; then
              echo "is_release=true" >> $GITHUB_OUTPUT
            else
              echo "is_release=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

          echo "📦 App version: $VERSION"

      - name: 📋 Print version info
        run: |
          echo "Version: ${{ steps.extract-version.outputs.version }}"
          echo "Is Release: ${{ steps.extract-version.outputs.is_release }}"
          echo "Git SHA: ${{ github.sha }}"

  # ── Job 2: Build and push the six tier images ────────────────────────────
  build-and-push:
    name: 🐳 Build & Push ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [version]
    permissions:
      contents: read
      packages: write  # Needed to push to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: svc-bff, scope: "@deployer/bff", dir: apps/api-services/bff, port: "3005" }
          - { app: svc-health, scope: "@deployer/svc-health", dir: apps/api-services/services/health, port: "3101" }
          - { app: svc-identity, scope: "@deployer/svc-identity", dir: apps/api-services/services/identity, port: "3102" }
          - { app: svc-project, scope: "@deployer/svc-project", dir: apps/api-services/services/project, port: "3103" }
          - { app: svc-fleet, scope: "@deployer/svc-fleet", dir: apps/api-services/services/fleet, port: "3104" }
          - { app: svc-runtime, scope: "@deployer/svc-runtime", dir: apps/api-services/services/runtime, port: "3105" }

    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐰 Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Build image tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          BASE="${{ env.REGISTRY }}/$OWNER/$REPO/${{ matrix.app }}"
          VERSION="${{ needs.version.outputs.version }}"
          SHA="${{ needs.version.outputs.git_sha }}"

          TAGS="$BASE:latest,$BASE:$VERSION,$BASE:${SHA:0:8}"

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "🐳 Image tags: $TAGS"

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/builder/api/Dockerfile.api.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # One cache scope per app: the six builds share the base layers but
          # diverge at the pruned workspace, and a shared scope would thrash.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            PRUNE_SCOPE=${{ matrix.scope }}
            APP_DIR=${{ matrix.dir }}
            APP_PORT=${{ matrix.port }}
          secrets: |
            turbo_token=${{ secrets.TURBO_TOKEN }}
            turbo_team=${{ vars.TURBO_TEAM }}
            turbo_api=${{ vars.TURBO_API }}

      - name: 📋 Generate deployment summary
        run: |
          {
            echo "### 🐳 ${{ matrix.app }}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Image** | ${{ steps.meta.outputs.base }} |"
            echo "| **Tags** | ${{ steps.meta.outputs.tags }} |"
            echo "| **App Version** | ${{ needs.version.outputs.version }} |"
            echo "| **Git SHA** | ${{ github.sha }} |"
            echo "| **Trigger** | ${{ github.event_name }} (${{ github.ref_name }}) |"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

  # ── Job 3: Create GitHub Release (only for version tags) ──────────────────
  release:
    name: 📝 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build-and-push]
    if: needs.version.outputs.is_release == 'true'
    permissions:
      contents: write  # Needed to create releases

    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔖 Generate release notes
        id: release-notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          echo "## 🚀 Deployer v$VERSION" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### 📦 Docker Images" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo '```bash' >> /tmp/release-notes.md
          for APP in svc-bff svc-health svc-identity svc-project svc-fleet svc-runtime; do
            echo "docker pull ${{ env.REGISTRY }}/$OWNER/$REPO/$APP:$VERSION" >> /tmp/release-notes.md
          done
          echo '```' >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "### 📋 Changes" >> /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          git log --oneline "$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" --format="* %s" >> /tmp/release-notes.md

      - name: 📝 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body_path: /tmp/release-notes.md
          draft: true
          prerelease: false
